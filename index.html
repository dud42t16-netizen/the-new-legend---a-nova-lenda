        if(ringFire){
          ctx.strokeStyle=`rgba(255,100,20,${0.5+Math.sin(Date.now()*0.01)*0.2})`;
          ctx.lineWidth=10;ctx.beginPath();ctx.arc(ringFire.x,ringFire.y,ringFire.r,0,Math.PI*2);ctx.stroke();
          ctx.strokeStyle='rgba(255,200,80,0.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(ringFire.x,ringFire.y,ringFire.r,0,Math.PI*2);ctx.stroke();
        }
        lavaZones.forEach(z=>{
          const pulse=0.7+Math.sin(z.pulse)*0.3;
          const g=ctx.createRadialGradient(z.x,z.y,2,z.x,z.y,z.r);
          g.addColorStop(0,`rgba(255,80,0,${0.45*pulse})`);g.addColorStop(0.6,`rgba(180,30,0,${0.25*pulse})`);g.addColorStop(1,'rgba(0,0,0,0)');
          ctx.fillStyle=g;ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.fill();
        });

        bossProjectiles.forEach(p=>{
          if(p.type==='homing'){
            if(p.trail){p.trail.forEach(t=>{const a=t.life/20;ctx.globalAlpha=a*0.6;const g=ctx.createRadialGradient(t.x,t.y,1,t.x,t.y,p.size*0.8);g.addColorStop(0,`rgba(200,140,255,${a})`);g.addColorStop(1,'rgba(100,40,180,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(t.x,t.y,p.size*0.7,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1}
            const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,p.size*2.2);
            g.addColorStop(0,'#ffffff');g.addColorStop(0.25,'#e0b0ff');g.addColorStop(0.55,'#a040ff');g.addColorStop(1,'rgba(60,0,120,0)');
            ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*2.2,0,Math.PI*2);ctx.fill();
          }else if(p.type==='reflectable'){
            const col=p.reflected?'#88ffaa':'#ffee66';
            const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,p.size*1.8);
            g.addColorStop(0,'#ffffff');g.addColorStop(0.3,col);g.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*1.8,0,Math.PI*2);ctx.fill();
            ctx.strokeStyle=p.reflected?'#44ff88':'#ffcc00';ctx.lineWidth=3;
            ctx.beginPath();ctx.arc(p.x,p.y,p.size*1.1,0,Math.PI*2);ctx.stroke();
            if(!p.reflected&&reflectWindow>0){
              ctx.fillStyle='rgba(255,255,100,0.95)';ctx.font='bold 14px Arial';ctx.textAlign='center';
              ctx.fillText('REBATA!',p.x,p.y-p.size-12);
            }
          }else if(p.type==='bounce'||p.type==='wave'||p.type==='ember'||p.type==='meteor'){
            const g=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,p.size*1.5);
            g.addColorStop(0,'#fff0c0');g.addColorStop(0.35,'#ff8800');g.addColorStop(1,'rgba(180,20,0,0)');
            ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*1.5,0,Math.PI*2);ctx.fill();
          }else if(p.type==='orb'){
            const g=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,p.size*1.6);
            g.addColorStop(0,'#e8d0ff');g.addColorStop(0.4,'#a040ff');g.addColorStop(1,'rgba(80,0,160,0)');
            ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*1.6,0,Math.PI*2);ctx.fill();
          }else if(p.type==='bolt'){
            ctx.strokeStyle='rgba(160,80,255,0.35)';ctx.lineWidth=8;
            ctx.beginPath();ctx.moveTo(p.x,p.y-28);ctx.lineTo(p.x+(Math.random()-0.5)*6,p.y);ctx.lineTo(p.x,p.y+22);ctx.stroke();
            ctx.strokeStyle='rgba(200,140,255,0.9)';ctx.lineWidth=3;
            ctx.beginPath();ctx.moveTo(p.x,p.y-28);ctx.lineTo(p.x+3,p.y-10);ctx.lineTo(p.x-2,p.y+5);ctx.lineTo(p.x,p.y+22);ctx.stroke();
          }else if(p.type==='ally'){
            const g=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,p.size);
            g.addColorStop(0,'#fff');g.addColorStop(0.5,'#60e0ff');g.addColorStop(1,'rgba(0,150,200,0)');
            ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
          }
        });
        groundMarks.forEach(m=>{
          const alpha=Math.min(1,m.life/120)*(m.flash>0?1:0.6);
          ctx.globalAlpha=alpha;
          const g=ctx.createRadialGradient(m.x,m.y,2,m.x,m.y,m.r);
          g.addColorStop(0,'rgba(200,100,255,0.55)');g.addColorStop(0.4,'rgba(140,50,220,0.35)');g.addColorStop(1,'rgba(0,0,0,0)');
          ctx.fillStyle=g;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
        });
      }

      function drawMenu(){
        const w=canvas.width,h=canvas.height;
        ctx.fillStyle='#0a0806';ctx.fillRect(0,0,w,h);
        ctx.strokeStyle='#c9a227';ctx.lineWidth=3;ctx.strokeRect(20,20,w-40,h-40);
        ctx.strokeStyle='rgba(201,162,39,0.3)';ctx.lineWidth=1;ctx.strokeRect(28,28,w-56,h-56);
        ctx.fillStyle='#e8d5a3';ctx.font='bold 42px Georgia,serif';ctx.textAlign='center';
        ctx.fillText('THE NEW LEGEND',w/2,h*0.28);
        ctx.fillStyle='rgba(201,162,39,0.7)';ctx.font='16px Georgia,serif';ctx.fillText('A torre aguarda...',w/2,h*0.28+36);
        menuButtons.forEach(btn=>{
          const disabled=btn.disabled;
          ctx.fillStyle=disabled?'#1a1510':'#1a1a12';ctx.fillRect(btn.x,btn.y,btn.w,btn.h);
          ctx.strokeStyle=disabled?'#555':'#c9a227';ctx.lineWidth=2.5;ctx.strokeRect(btn.x,btn.y,btn.w,btn.h);
          ctx.fillStyle=disabled?'#666':'#fff';ctx.font='bold 20px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText(btn.text,btn.x+btn.w/2,btn.y+btn.h/2);
        });
        if(saveMsgTimer>0){ctx.fillStyle='rgba(255,100,80,0.9)';ctx.font='14px Arial';ctx.textAlign='center';ctx.fillText('Nenhum jogo salvo encontrado',w/2,h*0.75)}
      }
      function drawPauseOverlay(){
        const w=canvas.width,h=canvas.height;
        ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,w,h);
        ctx.fillStyle='#e8d5a3';ctx.font='bold 36px Georgia,serif';ctx.textAlign='center';ctx.fillText('PAUSADO',w/2,h/2-90);
        pauseButtons.forEach(btn=>{
          ctx.fillStyle='#1a1a12';ctx.fillRect(btn.x,btn.y,btn.w,btn.h);
          ctx.strokeStyle='#c9a227';ctx.lineWidth=2.5;ctx.strokeRect(btn.x,btn.y,btn.w,btn.h);
          ctx.fillStyle='#fff';ctx.font='bold 18px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText(btn.text,btn.x+btn.w/2,btn.y+btn.h/2);
        });
        if(saveMsgTimer>0){ctx.fillStyle='#7dff9a';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText('Jogo salvo!',w/2,h/2+160)}
      }

      function draw(){
          const w=canvas.width,h=canvas.height;
          if(gameState==='title'){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);ctx.globalAlpha=titleAlpha;ctx.fillStyle='#e8d5a3';ctx.font='bold 48px Georgia,serif';ctx.textAlign='center';ctx.fillText('THE NEW LEGEND',w/2,h/2);ctx.globalAlpha=1;return}
          if(gameState==='menu'){drawMenu();return}
          if(gameState==='floor_clear'){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);ctx.fillStyle='#e8d5a3';ctx.font='bold 32px Georgia,serif';ctx.textAlign='center';ctx.fillText('Andar limpo',w/2,h/2-20);ctx.font='20px Georgia,serif';ctx.fillStyle='#fff';ctx.fillText('Você descansa um pouco e avança.',w/2,h/2+25);return}
          if(gameState==='pre_rescue'){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);drawDialogBox('','Você lutou bravamente, mas a exaustão e seus ferimentos foram mais fortes. Você observa os monstros vindo em sua direção com o olhar turvo e sem conseguir se mexer.',null);return}

          if(gameState==='tempestas_dialog'){
            const d=tempestasDialogs[tempestasDialogIndex];
            if(isNarration(d)){drawNarrationScreen(d.text);return}
            drawEchoDialogBg();
            if(d.portrait==='tempestas'&&tempestasSp){const maxH=Math.min(h*0.28,140);drawTempestasSprite((w-tempestasSp.width*(maxH/tempestasSp.height))/2,h*0.02,maxH)}
            drawDialogBox(d.speaker,d.text,d.portrait);return;
          }
          if(gameState==='post_tempestas'){
            const d=postTempestasDialogs[postTempestasIndex];
            if(isNarration(d)){drawNarrationScreen(d.text);return}
            drawEchoDialogBg();
            if(d.portrait==='tempestas'&&tempestasSp){const maxH=Math.min(h*0.22,110);drawTempestasSprite((w-tempestasSp.width*(maxH/tempestasSp.height))/2,h*0.04,maxH)}
            drawDialogBox(d.speaker,d.text,d.portrait);return;
          }
          if(gameState==='ignis_dialog'){
            const d=ignisDialogs[ignisDialogIndex];
            if(isNarration(d)){drawNarrationScreen(d.text);return}
            drawFlameDialogBg();
            if(d.portrait==='ignis'&&ignisSp){const maxH=Math.min(h*0.30,150);drawIgnisSprite((w-ignisSp.width*(maxH/ignisSp.height))/2,h*0.02,maxH)}
            drawDialogBox(d.speaker,d.text,d.portrait);return;
          }
          if(gameState==='post_ignis'){
            const d=postIgnisDialogs[Math.min(postIgnisIndex,postIgnisDialogs.length-1)];
            if(!d){goToTransition();return}
            if(isNarration(d)){drawNarrationScreen(d.text);return}
            drawFlameDialogBg();
            if(d.portrait==='ignis'&&ignisSp){
              const maxH=Math.min(h*0.28,140);
              drawIgnisSprite((w-ignisSp.width*(maxH/ignisSp.height))/2,h*0.02,maxH);
            }
            drawDialogBox(d.speaker,d.text,d.portrait);return;
          }

          if(gameState==='post10'){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);if(post10Step===0)drawDialogBox('Heros','Os monstros ficam mais fortes a cada andar. Já estou há algumas horas aqui dentro. Vou descansar mais um pouco e avançar.','heros');else if(post10Step===1){ctx.fillStyle='#e8d5a3';ctx.font='bold 28px Georgia,serif';ctx.textAlign='center';ctx.fillText('A cada andar você fica mais forte e habilidoso.',w/2,h/2)}else{ctx.fillStyle='#e8d5a3';ctx.font='bold 32px Georgia,serif';ctx.textAlign='center';ctx.fillText('Andar limpo',w/2,h/2-20);ctx.font='20px Georgia,serif';ctx.fillStyle='#fff';ctx.fillText('Você descansa um pouco e avança.',w/2,h/2+25)}return}
          if(gameState==='post50'){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);drawDialogBox('Heros','Já estou quase dois dias aqui. Está ficando muito difícil. Tenho que descansar mais tempo antes de subir um andar. Já sofri alguns ferimentos. Por sorte, quando limpo um andar ele fica vazio, então consigo dormir, comer e descansar. Nos últimos andares eu tive que usar mais estratégia. Sei que vai piorar. Vou descansar mais, fazer uns curativos e avançar. Não posso parar. E não vou.','heros');return}
          if(gameState==='post60'){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);drawDialogBox('Heros','Consigo sentir que estou mais forte. Vou avançar.','heros');return}
          if(gameState==='post80'){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);drawDialogBox('Heros','Já perdi as contas dos andares, mas sei que estou perto. Já quase quatro dias aqui. Dormir já não está sendo mais suficiente. Já estou ficando exausto. Os monstros são muito fortes. Não irei me render para esses vermes malditos. Vou ter que começar a descansar por mais tempo.','heros');return}
          if(gameState==='post93'){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);drawDialogBox('Heros','Já não estou mais aguentando. Meus remédios e poções já estão acabando, minha comida também. Já estou exausto. Estou uns 6 dias aqui, eu acho. Tive que começar a descansar mais. Os monstros estão em um nível absurdo. Tenho que me livrar deles ou a humanidade já era. Pelo meu lar, pelos meus amigos queridos, darei um fim a esses vermes.','heros');return}
          if(gameState==='post96'){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);if(post96Step===0)drawDialogBox('Heros','Droga... já estou sem forças e muito ferido. Esse último andar exigiu demais. Tenho que continuar... vou descansar um pouco...','heros');else drawDialogBox('','Heros desmaia antes de terminar a frase. Ferido e exausto, ele já tinha dado tudo de si há muito tempo. Normalmente seria impossível uma pessoa sozinha chegar até esse andar. Heros acorda exausto, sentindo o selo da torre já se romper, junta forças e parte ao próximo andar.',null);return}
          if(gameState==='rescue'){drawRescueScene();return}
          if(gameState==='floor_transition'){
            ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);ctx.fillStyle='#e8d5a3';ctx.font='bold 36px Georgia,serif';ctx.textAlign='center';ctx.fillText(transitionName,w/2,h/2-30);
            if(transitionBtn){ctx.fillStyle='#1a1a1a';ctx.fillRect(transitionBtn.x,transitionBtn.y,transitionBtn.w,transitionBtn.h);ctx.strokeStyle='#c9a227';ctx.lineWidth=3;ctx.strokeRect(transitionBtn.x,transitionBtn.y,transitionBtn.w,transitionBtn.h);ctx.fillStyle='#fff';ctx.font='20px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(transitionBtn.text,transitionBtn.x+transitionBtn.w/2,transitionBtn.y+transitionBtn.h/2)}
            return;
          }
          if(gameState==='victory'){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);ctx.fillStyle='#ffd700';ctx.font='bold 32px Georgia,serif';ctx.textAlign='center';ctx.fillText('Juntos até o fim',w/2,h/2-40);ctx.fillStyle='#fff';ctx.font='18px Georgia,serif';ctx.fillText('Heros e seus amigos seguem adiante.',w/2,h/2+10);ctx.fillText('Toque para voltar ao menu',w/2,h/2+50);return}
          if(['present_heros','story','meeting','friends','tower'].includes(gameState)){
            const d=dialogs[dialogIndex];
            if(isNarration(d)&&d.type!=='present'){drawNarrationScreen(d.text);return}
            if(gameState==='meeting'||gameState==='friends')drawCastleRoom();else{ctx.fillStyle='#000';ctx.fillRect(0,0,w,h)}
            drawDialogBox(d.speaker,d.text,d.portrait);return;
          }
          if(gameState==='playing'||gameState==='dead'){
            const theme=getTheme();
            drawFloorBackground(theme);
            if(theme.detail==='flames')drawFlameParticles();

            if(boss&&boss.hp>0){
              if(boss.kind==='dragon')drawDragon(boss);
              else if(boss.kind==='ignis')drawIgnisSprite(boss.x,boss.y,boss.h);
              else drawTempestasSprite(boss.x,boss.y,boss.h);
              const barW=200,barX=(w-barW)/2,barY=boss.y+boss.h+10;
              ctx.fillStyle='#222';ctx.fillRect(barX,barY,barW,16);
              ctx.fillStyle=boss.kind==='dragon'?'#c02030':boss.kind==='ignis'?'#ff4400':'#a040ff';
              ctx.fillRect(barX,barY,barW*(boss.hp/boss.maxHp),16);
              ctx.strokeStyle=boss.kind==='dragon'?'#ff6680':boss.kind==='ignis'?'#ffaa60':'#e0c0ff';ctx.lineWidth=1;ctx.strokeRect(barX,barY,barW,16);
              ctx.fillStyle=boss.kind==='dragon'?'#ff8899':boss.kind==='ignis'?'#ffcc88':'#c9a0ff';ctx.font='bold 13px Georgia,serif';ctx.textAlign='center';
              ctx.fillText(boss.kind==='dragon'?'Rei Dragão':boss.kind==='ignis'?'Ignis':'Tempestas',w/2,barY+30);
              ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
              ctx.fillText(`${Math.ceil(boss.hp)}/${boss.maxHp}`,w/2,barY+8);
              ctx.textBaseline='alphabetic';
            }

            drawBossProjectiles();

            if(gameState==='playing'){
              enemies.forEach(e=>{
                if(!e.alive)return;
                if(e.kind==='big'||e.kind==='mega'){if(e.kind==='mega')drawMegaMonster(e);else drawBigMonster(e)}
                else{
                  const s=e.size*(1+Math.sin(e.anim)*0.05),ox=(e.size-s)/2;
                  ctx.fillStyle=theme.enemy;ctx.fillRect(e.x+ox,e.y+ox,s,s);
                  ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.strokeRect(e.x+ox,e.y+ox,s,s);
                  if(e.canShoot){ctx.strokeStyle='#a0f';ctx.lineWidth=2;ctx.strokeRect(e.x+ox-2,e.y+ox-2,s+4,s+4)}
                }
                if(e.hp<e.maxHp){ctx.fillStyle='#333';ctx.fillRect(e.x,e.y-10,e.size,6);ctx.fillStyle='#e33';ctx.fillRect(e.x,e.y-10,e.size*(e.hp/e.maxHp),6)}
              });
              enemyShots.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fillStyle='#a0f';ctx.fill();ctx.beginPath();ctx.arc(s.x,s.y,s.size*0.5,0,Math.PI*2);ctx.fillStyle='#faf';ctx.fill()});
              particles.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life/28);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});
              healParticles.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life/40);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});
              fireballs.forEach(f=>{ctx.beginPath();ctx.arc(f.x,f.y,f.size,0,Math.PI*2);ctx.fillStyle='#ff4400';ctx.fill();ctx.beginPath();ctx.arc(f.x,f.y,f.size*0.55,0,Math.PI*2);ctx.fillStyle='#ffcc00';ctx.fill()});
              if(player.invincible<=0||Math.floor(player.invincible/3)%2===0)drawPlayer();
              drawPartyAllies();
              if(player.slashTimer>0){
                const t=player.slashTimer/16,cx=player.x+player.size/2,cy=player.y+player.size/2,arcR=swordRange*0.95;
                ctx.beginPath();ctx.arc(cx,cy,arcR,player.angle-1.2,player.angle+1.2);ctx.strokeStyle=`rgba(150,220,255,${t*0.25})`;ctx.lineWidth=16;ctx.lineCap='round';ctx.stroke();
                ctx.beginPath();ctx.arc(cx,cy,arcR*0.88,player.angle-1.0,player.angle+1.0);ctx.strokeStyle=`rgba(230,250,255,${t*0.85})`;ctx.lineWidth=3;ctx.stroke();
              }
              // HP bar
              ctx.fillStyle='#222';ctx.fillRect(20,18,190,22);
              ctx.fillStyle=player.hp>4?'#22cc44':'#ff3333';ctx.fillRect(20,18,(player.hp/player.maxHp)*190,22);
              ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(20,18,190,22);
              ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
              ctx.fillText(`HP: ${Math.ceil(player.hp)}/${player.maxHp}`,20+95,18+11);
              ctx.textAlign='left';ctx.textBaseline='alphabetic';
              ctx.fillStyle='#ffcc00';ctx.font='16px Arial';ctx.fillText(getTheme().name,20,56);
              if(killsNeeded>0)ctx.fillText(`Kills: ${kills}/${killsNeeded}  |  Total: ${totalKills}`,20,78);
              else ctx.fillText(`Total: ${totalKills}`,20,78);
              if(boss&&boss.kind==='ignis'){
                ctx.fillStyle='#222';ctx.fillRect(20,95,180,12);
                const heatColor=heat>70?'#ff2200':heat>40?'#ff8800':'#ffcc44';
                ctx.fillStyle=heatColor;ctx.fillRect(20,95,180*(heat/heatMax),12);
                ctx.strokeStyle='#ffaa60';ctx.lineWidth=1;ctx.strokeRect(20,95,180,12);
                ctx.fillStyle='#ffcc88';ctx.font='11px Arial';ctx.fillText('CALOR',28,105);
                if(damageBuff>0){ctx.fillStyle='#88ddff';ctx.font='bold 12px Arial';ctx.fillText('BUFF DA LIORA!',28,125)}
                if(ignisDown){ctx.fillStyle='#ffee88';ctx.font='bold 13px Arial';ctx.fillText('IGNIS CAÍDO '+Math.floor(ignisDownDamage)+'/100',28,145)}
              }
              if(boss&&boss.kind==='dragon'){
                ctx.fillStyle=dragonMode==='sword'?'#88aaff':dragonMode==='magic'?'#ff8866':'#aaffaa';
                ctx.font='bold 14px Arial';
                ctx.fillText(dragonMode==='sword'?'MODO: SÓ ESPADA':dragonMode==='magic'?'MODO: SÓ MAGIA':'MODO: LIVRE',20,100);
                if(dragonWind!==0){ctx.fillStyle='#aaddff';ctx.fillText(dragonWind<0?'← VENTO':'VENTO →',20,120)}
                if(dragonGrab>0){ctx.fillStyle='#ff6644';ctx.font='bold 16px Arial';ctx.fillText('AGARRADO! '+Math.floor(dragonGrabMash)+'/40',20,145)}
              }
            }
            if(isPaused&&gameState==='playing')drawPauseOverlay();
            if(gameState==='dead'){
              ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,w,h);
              ctx.fillStyle='#ff3333';ctx.font='bold 56px Arial';ctx.textAlign='center';ctx.fillText('VOCÊ MORREU',w/2,h/2-90);
              ctx.fillStyle='#fff';ctx.font='22px Arial';
              ctx.fillText(`Chegou no ${getTheme().name}`,w/2,h/2-35);
              ctx.fillText(`Total de monstros: ${totalKills}`,w/2,h/2);
              deathButtons.forEach(btn=>{
                ctx.fillStyle='#1a1a1a';ctx.fillRect(btn.x,btn.y,btn.w,btn.h);
                ctx.strokeStyle='#ff6600';ctx.lineWidth=3;ctx.strokeRect(btn.x,btn.y,btn.w,btn.h);
                ctx.fillStyle='#fff';ctx.font='20px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
                ctx.fillText(btn.text,btn.x+btn.w/2,btn.y+btn.h/2);
              });
            }
          }
        }

      function gameLoop(){update();draw();requestAnimationFrame(gameLoop)}
      carregarImagens().then(()=>{
        hasSave=checkSaveExists();
        gameState='title';titleAlpha=1;titleTimer=0;dialogIndex=0;
        gameLoop();
      });
   </script>
 </body>
</html>
