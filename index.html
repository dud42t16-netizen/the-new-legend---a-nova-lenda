<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>The New Legend</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        #mobileControls {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; pointer-events: none; z-index: 10;
        }
        #joystickZone {
            position: absolute; bottom: 25px; left: 25px;
            width: 110px; height: 110px; pointer-events: auto;
        }
        #joystickBase {
            width: 110px; height: 110px;
            background: rgba(255,255,255,0.11);
            border: 2px solid rgba(255,255,255,0.22);
            border-radius: 50%; position: absolute;
        }
        #joystickKnob {
            width: 50px; height: 50px;
            background: rgba(255,255,255,0.32);
            border-radius: 50%; position: absolute; top: 30px; left: 30px;
        }
        #fireBtn {
            position: absolute; bottom: 35px; right: 25px;
            width: 68px; height: 68px;
            background: rgba(255,80,0,0.32);
            border: 2px solid rgba(255,150,50,0.55);
            border-radius: 50%; pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            color: #ffcc88; font-size: 12px; font-weight: bold;
        }
        #pauseBtn {
            position: absolute; top: 15px; right: 15px;
            width: 42px; height: 42px;
            background: rgba(0,0,0,0.45);
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 10px; pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 16px; z-index: 20;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="mobileControls">
        <div id="joystickZone">
            <div id="joystickBase"></div>
            <div id="joystickKnob"></div>
        </div>
        <div id="fireBtn">FOGO</div>
        <div id="pauseBtn">❚❚</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isMobile) document.getElementById('mobileControls').style.display = 'block';

        const SPRITE_PATH = 'cavaleiro_sprites/';
        const sprites = {};
        const portraits = {};

        const loadImage = (src) => new Promise(resolve => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => resolve(null);
            img.src = src;
        });

        async function carregarImagens() {
            const listaSprites = [
                'andar_baixo_spritesheet','andar_cima_spritesheet',
                'andar_esquerda_spritesheet','andar_direita_spritesheet',
                'parado_baixo_spritesheet','parado_cima_spritesheet',
                'parado_esquerda_spritesheet','parado_direita_spritesheet',
                'ataque_horizontal_baixo_spritesheet','ataque_horizontal_cima_spritesheet',
                'ataque_horizontal_esquerda_spritesheet','ataque_horizontal_direita_spritesheet'
            ];
            for (const nome of listaSprites) {
                sprites[nome] = await loadImage(SPRITE_PATH + nome + '.png');
            }
            portraits['heros'] = await loadImage(SPRITE_PATH + 'heros.png');
            portraits['mago-anciao'] = await loadImage(SPRITE_PATH + 'mago-anciao.png');
            portraits['liora'] = await loadImage(SPRITE_PATH + 'liora.png');
            portraits['valeria'] = await loadImage(SPRITE_PATH + 'valeria.png');
            portraits['lucian'] = await loadImage(SPRITE_PATH + 'lucian.png');
        }

        const animConfig = {
            andar_baixo:   { sheet:'andar_baixo_spritesheet', fw:64, fh:64, frames:8, speed:6 },
            andar_cima:    { sheet:'andar_cima_spritesheet', fw:64, fh:64, frames:8, speed:6 },
            andar_esquerda:{ sheet:'andar_esquerda_spritesheet', fw:64, fh:64, frames:8, speed:6 },
            andar_direita: { sheet:'andar_direita_spritesheet', fw:64, fh:64, frames:8, speed:6 },
            parado_baixo:  { sheet:'parado_baixo_spritesheet', fw:64, fh:64, frames:4, speed:18 },
            parado_cima:   { sheet:'parado_cima_spritesheet', fw:64, fh:64, frames:4, speed:18 },
            parado_esquerda:{ sheet:'parado_esquerda_spritesheet', fw:64, fh:64, frames:5, speed:18 },
            parado_direita:{ sheet:'parado_direita_spritesheet', fw:64, fh:64, frames:5, speed:18 },
            ataque_baixo:  { sheet:'ataque_horizontal_baixo_spritesheet', fw:64, fh:64, frames:5, speed:4 },
            ataque_cima:   { sheet:'ataque_horizontal_cima_spritesheet', fw:64, fh:64, frames:5, speed:4 },
            ataque_esquerda:{ sheet:'ataque_horizontal_esquerda_spritesheet', fw:96, fh:64, frames:6, speed:4 },
            ataque_direita:{ sheet:'ataque_horizontal_direita_spritesheet', fw:96, fh:64, frames:6, speed:4 }
        };

        // 7 andares
        const floors = [
            { name: 'Andar 1 - Pedra Antiga', ground: '#3d3d3d', accent: '#555', enemy: '#111' },
            { name: 'Andar 2 - Floresta Sombria', ground: '#1a331a', accent: '#2d5a2d', enemy: '#0a1a0a' },
            { name: 'Andar 3 - Caverna de Cristal', ground: '#2a1a4e', accent: '#5a3a8a', enemy: '#0f0520' },
            { name: 'Andar 4 - Inferno', ground: '#4a1515', accent: '#8a3030', enemy: '#1a0505' },
            { name: 'Andar 5 - Gelo Eterno', ground: '#1a2a3a', accent: '#3a5a7a', enemy: '#051015' },
            { name: 'Andar 6 - Ruínas Douradas', ground: '#3d2e10', accent: '#8a6a20', enemy: '#1a1205' },
            { name: 'Andar 7 - Vazio', ground: '#121212', accent: '#333', enemy: '#000' }
        ];

        let gameState = 'title';
        let isPaused = false;
        let titleAlpha = 1;
        let titleTimer = 0;
        let dialogIndex = 0;

        // Transição de andar
        let pendingFloor = 0;
        let transitionName = '';

        const dialogs = [
            { type:'present', speaker:'Heros', portrait:'heros',
              text:'Este é você: Heros, um guerreiro forte e destemido. Seu vilarejo foi destruído por monstros poderosos que conseguiram romper o selo da torre. Você e seus amigos estavam explorando a floresta e, por um milagre, sobreviveram. Porém, perderam a família e o lar. Nenhum de vocês jamais superou esse trauma. E você prometeu vingança.' },
            { type:'story', speaker:'', portrait:null,
              text:'Em um mundo de magia existe uma torre, o lar dos monstros. Deles saíam criaturas que espalhavam caos pelo mundo, até que o herói do passado — considerado uma lenda — sacrificou a própria vida para selar a torre.' },
            { type:'story', speaker:'', portrait:null,
              text:'Mas o selo era temporário. Cem anos depois, ele começa a se romper. Os monstros voltarão a sair. E quando o rei deles surgir junto, a humanidade não terá chance.' },
            { type:'story', speaker:'', portrait:null,
              text:'A humanidade reuniu os guerreiros mais fortes para entrar na torre antes que o selo se quebrasse. Porém, alguns só se preocupavam consigo mesmos. Outros tinham medo. Ninguém se atreveu a ir.' },
            { type:'story', speaker:'', portrait:null,
              text:'Até que surgiu um guerreiro destemido. Aquele que declarou que entraria na torre sozinho, com coragem e uma fúria que queimava como o sol. Seu nome era Heros.' },
            { type:'meeting', speaker:'Vozes', portrait:null,
              text:'Você vai sozinho? Está louco? Deve ser piada!' },
            { type:'meeting', speaker:'Mago Ancião', portrait:'mago-anciao',
              text:'Heros, com o seu nível de poder, sendo um cavaleiro forte e habilidoso com magia, é provável que você limpe os primeiros andares com facilidade. Mas e os andares superiores? E o rei deles? Você não conseguirá sozinho.' },
            { type:'meeting', speaker:'Heros', portrait:'heros',
              text:'Eu darei um fim a esses monstros malditos que destruíram nosso lar. Vou entrar lá e fazer com que sofram. Darei minha vida por isso. Matarei o máximo que puder. Quando eu cair, juntem o maior exército possível e enfrentem apenas o rei deles. Isso ajuda, não é?' },
            { type:'meeting', speaker:'Mago Ancião', portrait:'mago-anciao',
              text:'De fato, seria possível vencer enfrentando somente o rei... com baixas e muito esforço. Mas, Heros, não será um caminho tranquilo. Seu ódio, por mais forte que seja, pode não ser o suficiente.' },
            { type:'meeting', speaker:'Heros', portrait:'heros',
              text:'Será o suficiente. Eles conhecerão o medo. Já está decidido. Estou pronto. Partirei agora, depois de me despedir dos meus companheiros. Juntem os mais habilidosos.' },
            { type:'meeting', speaker:'Mago Ancião', portrait:'mago-anciao',
              text:'Entendido. Não temos escolha. Eu lhe desejo sorte. Que as almas dos guerreiros e do herói da lenda estejam com você. Adeus, meu rapaz. Foi uma honra lutar ao seu lado.' },
            { type:'meeting', speaker:'Heros', portrait:'heros',
              text:'Digo o mesmo. Adeus, guerreiros.' },
            { type:'friends', speaker:'', portrait:null,
              text:'Heros encontra seus amigos: Liora e os irmãos Valeria e Lucian.' },
            { type:'friends', speaker:'Valeria', portrait:'valeria',
              text:'Isso é loucura, Heros. Por favor, reconsidere. Por nós. Não deixaremos que você parta.' },
            { type:'friends', speaker:'Liora', portrait:'liora',
              text:'Por favor, Heros...' },
            { type:'friends', speaker:'Lucian', portrait:'lucian',
              text:'Vamos lá, cara... assim não dá. Não vai ser um caminho tranquilo.' },
            { type:'friends', speaker:'Heros', portrait:'heros',
              text:'Já estou decidido. Não temos escolha. Vocês são as pessoas mais importantes do mundo para mim.' },
            { type:'friends', speaker:'Valeria', portrait:'valeria',
              text:'Então iremos com você.' },
            { type:'friends', speaker:'Heros', portrait:'heros',
              text:'Vocês não conseguem. O passado ainda nos assombra. Você tem medo, Valeria, mas não é culpa sua. Olhe para o seu irmão e para a Liora... eles não vão conseguir. Não é culpa de vocês. Vocês terão que enfrentar o rei. Recomponham-se, amigos. Tragam a paz à humanidade e não morram. Depois, vivam felizes.' },
            { type:'friends', speaker:'Valeria', portrait:'valeria', text:'...' },
            { type:'friends', speaker:'Liora', portrait:'liora', text:'...' },
            { type:'friends', speaker:'Lucian', portrait:'lucian', text:'...' },
            { type:'friends', speaker:'Heros', portrait:'heros',
              text:'Não temos escolha. Adeus, amigos. Obrigado por tudo. Darei minha vida pelo nosso lar. Adeus.' },
            { type:'friends', speaker:'', portrait:null,
              text:'Heros parte, deixando seus amigos que choram ao ver sua partida, com culpa e dor. Eles se despedem de você.' },
            { type:'tower', speaker:'', portrait:null,
              text:'Heros chega à torre. A barreira repele monstros, mas não tem efeito em humanos. Ele entra sem problemas.' },
            { type:'tower', speaker:'Heros', portrait:'heros',
              text:'Respirando fundo, com fúria e determinação, Heros lembra da promessa de vingança que fez diante do seu vilarejo destruído. Com o foco renovado, ele avança.' }
        ];

        let currentFloor = 0, killsNeeded = 20, kills = 0, totalKills = 0;
        let enemySpeed = 0.55, maxEnemies = 4;

        const player = {
            x:0, y:0, size:48, speed:3.8,
            hp:10, maxHp:10, angle:Math.PI/2, dir:'baixo',
            state:'parado', frame:0, frameTimer:0,
            attackCooldown:0, fireCooldown:0, slashTimer:0, invincible:0
        };

        let enemies = [], fireballs = [], particles = [], deathButtons = [];
        const ENEMY_SIZE = 28, RESPAWN_TIME = 220;
        const keys = {};
        let mouse = { left:false, right:false };
        let joyActive = false, joyTouchId = null, joyDX = 0, joyDY = 0;
        const joyKnob = document.getElementById('joystickKnob');
        const joyZone = document.getElementById('joystickZone');

        function getTheme() {
            return floors[Math.min(currentFloor, floors.length - 1)];
        }

        function getAnimKey() {
            if (player.state === 'ataque') return 'ataque_' + player.dir;
            if (player.state === 'andar') return 'andar_' + player.dir;
            return 'parado_' + player.dir;
        }

        function drawPlayer() {
            const key = getAnimKey();
            const conf = animConfig[key];
            if (!conf) return;
            const sheet = sprites[conf.sheet];
            if (!sheet) {
                ctx.fillStyle = '#2060ff';
                ctx.fillRect(player.x, player.y, player.size, player.size);
                return;
            }
            const frameToUse = (player.state === 'parado') ? 0 : Math.min(player.frame, conf.frames - 1);
            const fw = conf.fw, fh = conf.fh;
            const sx = frameToUse * fw;
            const drawW = player.size * (fw / 64);
            const ox = (drawW - player.size) / 2;
            ctx.drawImage(sheet, sx, 0, fw, fh, player.x - ox, player.y, drawW, player.size);
        }

        function drawCastleRoom() {
            const w = canvas.width, h = canvas.height;
            ctx.fillStyle = '#2a2a2e';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#1c1c20';
            ctx.fillRect(0, h * 0.62, w, h * 0.38);
            ctx.fillStyle = '#4a1c1c';
            const rugW = w * 0.55, rugH = h * 0.22;
            ctx.fillRect((w - rugW) / 2, h * 0.68, rugW, rugH);
            ctx.strokeStyle = '#8a6a2a';
            ctx.lineWidth = 3;
            ctx.strokeRect((w - rugW) / 2 + 4, h * 0.68 + 4, rugW - 8, rugH - 8);
            ctx.fillStyle = '#3a3a42';
            ctx.fillRect(w * 0.12, h * 0.08, 28, h * 0.54);
            ctx.fillRect(w * 0.88 - 28, h * 0.08, 28, h * 0.54);
        }

        function drawDialogBox(speaker, text, portraitKey) {
            const w = canvas.width, h = canvas.height;
            if (portraitKey && portraits[portraitKey]) {
                const img = portraits[portraitKey];
                const maxH = Math.min(h * 0.48, 320);
                const scale = maxH / img.height;
                const pw = img.width * scale;
                const ph = img.height * scale;
                ctx.drawImage(img, (w - pw) / 2, h * 0.06, pw, ph);
            }
            const boxH = Math.min(150, h * 0.26);
            const boxY = h - boxH - 16;
            const boxX = 16;
            const boxW = w - 32;
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#c9a227';
            ctx.lineWidth = 3;
            ctx.strokeRect(boxX, boxY, boxW, boxH);
            if (speaker) {
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 17px Georgia, serif';
                ctx.textAlign = 'left';
                ctx.fillText(speaker, boxX + 16, boxY + 26);
            }
            ctx.fillStyle = '#fff';
            ctx.font = '15px Georgia, serif';
            ctx.textAlign = 'left';
            const maxWidth = boxW - 32;
            const words = text.split(' ');
            let line = '', ly = boxY + (speaker ? 50 : 34);
            for (let i = 0; i < words.length; i++) {
                const test = line + words[i] + ' ';
                if (ctx.measureText(test).width > maxWidth && line !== '') {
                    ctx.fillText(line, boxX + 16, ly);
                    line = words[i] + ' ';
                    ly += 20;
                    if (ly > boxY + boxH - 20) break;
                } else line = test;
            }
            ctx.fillText(line, boxX + 16, ly);
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.font = '12px Arial';
            ctx.textAlign = 'right';
            ctx.fillText('▼', boxX + boxW - 14, boxY + boxH - 10);
        }

        function advanceDialog() {
            dialogIndex++;
            if (dialogIndex >= dialogs.length) {
                startGameplay();
                return;
            }
            const d = dialogs[dialogIndex];
            if (d.type === 'present') gameState = 'present_heros';
            else if (d.type === 'story') gameState = 'story';
            else if (d.type === 'meeting') gameState = 'meeting';
            else if (d.type === 'friends') gameState = 'friends';
            else if (d.type === 'tower') gameState = 'tower';
        }

        function startGameplay() {
            gameState = 'playing';
            isPaused = false;
            currentFloor = 0;
            killsNeeded = 20;
            kills = 0;
            totalKills = 0;
            enemySpeed = 0.55;
            maxEnemies = 4;
            player.maxHp = 10;
            player.hp = 10;
            player.x = canvas.width / 2 - player.size / 2;
            player.y = canvas.height / 2 - player.size / 2;
            player.angle = Math.PI / 2;
            player.dir = 'baixo';
            player.state = 'parado';
            player.frame = 0;
            player.attackCooldown = 0;
            player.fireCooldown = 0;
            player.slashTimer = 0;
            player.invincible = 0;
            enemies = []; fireballs = []; particles = []; deathButtons = [];
            for (let i = 0; i < maxEnemies; i++) spawnEnemy();
        }

        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let x, y;
            if (side === 0) { x = Math.random() * canvas.width; y = -ENEMY_SIZE - 10; }
            else if (side === 1) { x = canvas.width + ENEMY_SIZE + 10; y = Math.random() * canvas.height; }
            else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + ENEMY_SIZE + 10; }
            else { x = -ENEMY_SIZE - 10; y = Math.random() * canvas.height; }
            enemies.push({ x, y, size: ENEMY_SIZE, alive: true, respawnTimer: 0, anim: Math.random() * Math.PI * 2 });
        }

        function createFireball() {
            if (player.fireCooldown > 0 || isPaused) return;
            const speed = 9.5;
            fireballs.push({
                x: player.x + player.size / 2, y: player.y + player.size / 2,
                vx: Math.cos(player.angle) * speed, vy: Math.sin(player.angle) * speed,
                size: 13, life: 85
            });
            player.fireCooldown = 28;
        }

        function swordAttack() {
            if (player.attackCooldown > 0 || player.state === 'ataque' || isPaused) return;
            player.state = 'ataque';
            player.frame = 0; player.frameTimer = 0;
            player.attackCooldown = 22; player.slashTimer = 16;
            const range = 70;
            const ax = player.x + player.size / 2 + Math.cos(player.angle) * (range * 0.55);
            const ay = player.y + player.size / 2 + Math.sin(player.angle) * (range * 0.55);
            enemies.forEach(e => {
                if (!e.alive) return;
                const dx = e.x + e.size / 2 - ax, dy = e.y + e.size / 2 - ay;
                if (Math.sqrt(dx * dx + dy * dy) < 58) killEnemy(e);
            });
        }

        function killEnemy(enemy) {
            enemy.alive = false;
            enemy.respawnTimer = RESPAWN_TIME;
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: enemy.x + enemy.size / 2, y: enemy.y + enemy.size / 2,
                    vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7,
                    size: 3 + Math.random() * 3, life: 22 + Math.random() * 12,
                    color: `hsl(${Math.random() * 40 + 10},85%,55%)`
                });
            }
            kills++;
            totalKills++;
            if (kills >= killsNeeded) {
                requestNextFloor();
            }
        }

        // ===== TRANSIÇÃO DE ANDAR =====
        function requestNextFloor() {
            // Se acabou de completar o andar 3 (índice 2), mostra fala do Heros antes
            if (currentFloor === 2) {
                gameState = 'floor_comment';
                return;
            }
            goToTransition();
        }

        function goToTransition() {
            pendingFloor = currentFloor + 1;
            if (pendingFloor >= floors.length) {
                // Zerou os 7 andares (por enquanto)
                gameState = 'victory';
                return;
            }
            transitionName = floors[pendingFloor].name;
            gameState = 'floor_transition';
        }

        function applyNextFloor() {
            currentFloor = pendingFloor;
            kills = 0;

            if (currentFloor < 3) {
                killsNeeded *= 2;
                enemySpeed *= 1.333;
                maxEnemies = Math.floor(maxEnemies * 1.333);
            } else if (currentFloor === 3) {
                killsNeeded = Math.floor(killsNeeded * 1.5);
                enemySpeed *= 1.2;
                maxEnemies = Math.floor(maxEnemies * 1.15);
            } else {
                // 5, 6, 7: mesma dificuldade do 4, um pouco menos monstros
                maxEnemies = Math.max(4, Math.floor(maxEnemies * 0.92));
            }

            player.maxHp = 10 + (currentFloor * 10);
            player.hp = player.maxHp;

            enemies = [];
            fireballs = [];
            particles = [];
            for (let i = 0; i < maxEnemies; i++) spawnEnemy();

            player.x = canvas.width / 2 - player.size / 2;
            player.y = canvas.height / 2 - player.size / 2;
            player.state = 'parado';
            player.frame = 0;
            player.attackCooldown = 0;
            player.fireCooldown = 0;
            player.slashTimer = 0;
            player.invincible = 30;

            gameState = 'playing';
        }

        function resetGame() { startGameplay(); }

        function restartFloor() {
            kills = 0;
            isPaused = false;
            player.hp = player.maxHp;
            player.x = canvas.width / 2 - player.size / 2;
            player.y = canvas.height / 2 - player.size / 2;
            player.state = 'parado';
            player.frame = 0;
            player.attackCooldown = 0;
            player.fireCooldown = 0;
            player.slashTimer = 0;
            player.invincible = 0;
            enemies = []; fireballs = []; particles = []; deathButtons = [];
            for (let i = 0; i < maxEnemies; i++) spawnEnemy();
            gameState = 'playing';
        }

        function createDeathButtons() {
            const cx = canvas.width / 2, cy = canvas.height / 2;
            deathButtons = [
                { text:'Reiniciar Andar', x:cx-130, y:cy+50, w:260, h:48, action:() => restartFloor() },
                { text:'Reiniciar do Início', x:cx-130, y:cy+115, w:260, h:48, action:() => resetGame() }
            ];
        }

        function togglePause() {
            if (gameState !== 'playing') return;
            isPaused = !isPaused;
        }

        function onAdvance() {
            if (['present_heros','story','meeting','friends','tower'].includes(gameState)) {
                advanceDialog();
                return;
            }
            if (gameState === 'floor_comment') {
                goToTransition();
                return;
            }
            if (gameState === 'floor_transition') {
                applyNextFloor();
                return;
            }
            if (gameState === 'victory') {
                resetGame();
            }
        }

        // ===== INPUT =====
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState === 'playing') togglePause();
                else onAdvance();
            }
            if (e.code === 'Enter' || e.code === 'KeyZ') onAdvance();
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        canvas.addEventListener('mousedown', e => {
            e.preventDefault();
            if (gameState === 'dead') {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left, my = e.clientY - rect.top;
                deathButtons.forEach(btn => {
                    if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) btn.action();
                });
                return;
            }
            if (['present_heros','story','meeting','friends','tower','floor_comment','floor_transition','victory'].includes(gameState)) {
                onAdvance();
                return;
            }
            if (gameState === 'playing' && !isPaused) {
                if (e.button === 0) mouse.left = true;
                if (e.button === 2) mouse.right = true;
            }
        });
        canvas.addEventListener('mouseup', e => {
            if (e.button === 0) mouse.left = false;
            if (e.button === 2) mouse.right = false;
        });
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        joyZone.addEventListener('touchstart', e => {
            e.preventDefault(); e.stopPropagation();
            if (joyActive || isPaused || gameState !== 'playing') return;
            const t = e.changedTouches[0];
            joyActive = true; joyTouchId = t.identifier;
            handleJoy(t);
        }, { passive:false });
        joyZone.addEventListener('touchmove', e => {
            e.preventDefault(); e.stopPropagation();
            if (!joyActive) return;
            for (let t of e.changedTouches) if (t.identifier === joyTouchId) { handleJoy(t); break; }
        }, { passive:false });
        function endJoy(e) {
            for (let t of e.changedTouches) {
                if (t.identifier === joyTouchId) {
                    joyActive = false; joyTouchId = null; joyDX = 0; joyDY = 0;
                    joyKnob.style.top = '30px'; joyKnob.style.left = '30px';
                    break;
                }
            }
        }
        joyZone.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); endJoy(e); }, { passive:false });
        joyZone.addEventListener('touchcancel', e => { e.preventDefault(); endJoy(e); }, { passive:false });
        function handleJoy(touch) {
            const rect = joyZone.getBoundingClientRect();
            const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
            let dx = touch.clientX - cx, dy = touch.clientY - cy;
            const dist = Math.sqrt(dx*dx+dy*dy), maxD = 38;
            if (dist > maxD) { dx = dx/dist*maxD; dy = dy/dist*maxD; }
            joyKnob.style.left = (30+dx)+'px'; joyKnob.style.top = (30+dy)+'px';
            joyDX = dx/maxD; joyDY = dy/maxD;
        }

        document.getElementById('fireBtn').addEventListener('touchstart', e => {
            e.preventDefault(); e.stopPropagation();
            if (gameState === 'playing' && !isPaused) createFireball();
        }, { passive:false });
        document.getElementById('pauseBtn').addEventListener('touchstart', e => {
            e.preventDefault(); e.stopPropagation();
            if (gameState === 'playing') togglePause();
        }, { passive:false });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (gameState === 'dead') {
                const t = e.changedTouches[0];
                const rect = canvas.getBoundingClientRect();
                const mx = t.clientX - rect.left, my = t.clientY - rect.top;
                deathButtons.forEach(btn => {
                    if (mx >= btn.x && mx <= btn.x+btn.w && my >= btn.y && my <= btn.y+btn.h) btn.action();
                });
                return;
            }
            if (['present_heros','story','meeting','friends','tower','floor_comment','floor_transition','victory'].includes(gameState)) {
                onAdvance();
                return;
            }
            if (gameState !== 'playing' || isPaused) return;
            const t = e.changedTouches[0];
            const joyR = joyZone.getBoundingClientRect();
            const fireR = document.getElementById('fireBtn').getBoundingClientRect();
            const pauseR = document.getElementById('pauseBtn').getBoundingClientRect();
            const onJoy = t.clientX>=joyR.left && t.clientX<=joyR.right && t.clientY>=joyR.top && t.clientY<=joyR.bottom;
            const onFire = t.clientX>=fireR.left && t.clientX<=fireR.right && t.clientY>=fireR.top && t.clientY<=fireR.bottom;
            const onPause = t.clientX>=pauseR.left && t.clientX<=pauseR.right && t.clientY>=pauseR.top && t.clientY<=pauseR.bottom;
            if (!onJoy && !onFire && !onPause) swordAttack();
        }, { passive:false });

        // ===== UPDATE =====
        function update() {
            if (gameState === 'title') {
                titleTimer++;
                if (titleTimer > 90) {
                    titleAlpha -= 0.012;
                    if (titleAlpha <= 0) {
                        titleAlpha = 0;
                        gameState = 'present_heros';
                        dialogIndex = 0;
                    }
                }
                return;
            }
            if (gameState !== 'playing' || isPaused) return;

            let dx = 0, dy = 0;
            if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
            if (joyActive) { dx = joyDX; dy = joyDY; }
            const moving = dx !== 0 || dy !== 0;

            if (moving && player.state !== 'ataque') {
                const len = Math.sqrt(dx*dx+dy*dy);
                if (len > 0) { dx /= len; dy /= len; }
                player.x += dx * player.speed;
                player.y += dy * player.speed;
                player.angle = Math.atan2(dy, dx);
                if (Math.abs(dx) > Math.abs(dy)) player.dir = dx > 0 ? 'direita' : 'esquerda';
                else player.dir = dy > 0 ? 'baixo' : 'cima';
                player.state = 'andar';
            } else if (player.state !== 'ataque') {
                player.state = 'parado';
                player.frame = 0;
            }

            const key = getAnimKey();
            const conf = animConfig[key];
            if (conf && player.state !== 'parado') {
                player.frameTimer++;
                if (player.frameTimer >= conf.speed) {
                    player.frameTimer = 0;
                    player.frame++;
                    if (player.frame >= conf.frames) {
                        player.frame = 0;
                        if (player.state === 'ataque') player.state = moving ? 'andar' : 'parado';
                    }
                }
            } else if (player.state === 'parado') player.frame = 0;

            player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

            if (mouse.left) swordAttack();
            else if (mouse.right) createFireball();

            if (player.attackCooldown > 0) player.attackCooldown--;
            if (player.fireCooldown > 0) player.fireCooldown--;
            if (player.slashTimer > 0) player.slashTimer--;
            if (player.invincible > 0) player.invincible--;

            enemies.forEach(enemy => {
                if (!enemy.alive) {
                    enemy.respawnTimer--;
                    if (enemy.respawnTimer <= 0) {
                        const side = Math.floor(Math.random()*4);
                        if (side===0){enemy.x=Math.random()*canvas.width;enemy.y=-ENEMY_SIZE-10;}
                        else if(side===1){enemy.x=canvas.width+ENEMY_SIZE+10;enemy.y=Math.random()*canvas.height;}
                        else if(side===2){enemy.x=Math.random()*canvas.width;enemy.y=canvas.height+ENEMY_SIZE+10;}
                        else{enemy.x=-ENEMY_SIZE-10;enemy.y=Math.random()*canvas.height;}
                        enemy.alive = true;
                        enemy.anim = Math.random()*Math.PI*2;
                    }
                    return;
                }
                enemy.anim += 0.09;
                const ang = Math.atan2(
                    player.y+player.size/2-(enemy.y+enemy.size/2),
                    player.x+player.size/2-(enemy.x+enemy.size/2)
                );
                enemy.x += Math.cos(ang)*enemySpeed;
                enemy.y += Math.sin(ang)*enemySpeed;
                if (player.invincible<=0 &&
                    player.x<enemy.x+enemy.size && player.x+player.size>enemy.x &&
                    player.y<enemy.y+enemy.size && player.y+player.size>enemy.y) {
                    player.hp -= 1;
                    player.invincible = 40;
                    killEnemy(enemy);
                    if (player.hp <= 0) { gameState = 'dead'; createDeathButtons(); }
                }
            });

            for (let i = fireballs.length-1; i>=0; i--) {
                const f = fireballs[i];
                f.x += f.vx; f.y += f.vy; f.life--;
                enemies.forEach(e => {
                    if (!e.alive) return;
                    const dx = e.x+e.size/2-f.x, dy = e.y+e.size/2-f.y;
                    if (Math.sqrt(dx*dx+dy*dy) < e.size/2+f.size/2) { killEnemy(e); f.life = 0; }
                });
                if (f.life<=0 || f.x<-60 || f.x>canvas.width+60 || f.y<-60 || f.y>canvas.height+60)
                    fireballs.splice(i,1);
            }

            for (let i = particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vx*=0.95; p.vy*=0.95; p.life--; p.size*=0.96;
                if (p.life<=0 || p.size<0.5) particles.splice(i,1);
            }

            if (Math.random()<0.007 && enemies.filter(e=>e.alive).length < maxEnemies) spawnEnemy();
        }

        // ===== DRAW =====
        function draw() {
            const w = canvas.width, h = canvas.height;

            if (gameState === 'title') {
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0,w,h);
                ctx.globalAlpha = titleAlpha;
                ctx.fillStyle = '#e8d5a3';
                ctx.font = 'bold 48px Georgia, serif';
                ctx.textAlign = 'center';
                ctx.fillText('THE NEW LEGEND', w/2, h/2);
                ctx.globalAlpha = 1;
                return;
            }

            // Fala do Heros depois do andar 3
            if (gameState === 'floor_comment') {
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0,w,h);
                drawDialogBox('Heros',
                    'Até agora foi fácil, mas os monstros estão ficando mais fortes e rápidos. Tenho que ficar alerta.',
                    'heros');
                return;
            }

            // Tela de transição de andar
            if (gameState === 'floor_transition') {
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0,w,h);
                ctx.fillStyle = '#e8d5a3';
                ctx.font = 'bold 36px Georgia, serif';
                ctx.textAlign = 'center';
                ctx.fillText(transitionName, w/2, h/2 - 10);
                ctx.font = '18px Georgia, serif';
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fillText('Toque ou clique para continuar', w/2, h/2 + 40);
                return;
            }

            if (gameState === 'victory') {
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0,w,h);
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 42px Georgia, serif';
                ctx.textAlign = 'center';
                ctx.fillText('Você sobreviveu aos 7 andares', w/2, h/2 - 30);
                ctx.fillStyle = '#fff';
                ctx.font = '20px Georgia, serif';
                ctx.fillText('Toque para jogar de novo', w/2, h/2 + 30);
                return;
            }

            if (['present_heros','story','meeting','friends','tower'].includes(gameState)) {
                const d = dialogs[dialogIndex];
                if (gameState === 'meeting' || gameState === 'friends') drawCastleRoom();
                else {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0,0,w,h);
                }
                drawDialogBox(d.speaker, d.text, d.portrait);
                return;
            }

            if (gameState === 'playing' || gameState === 'dead') {
                const theme = getTheme();
                ctx.fillStyle = theme.ground;
                ctx.fillRect(0,0,w,h);
                ctx.fillStyle = theme.accent;
                for (let i=0;i<w;i+=70) for (let j=0;j<h;j+=70) {
                    ctx.globalAlpha = 0.13;
                    ctx.fillRect(i+8,j+8,54,54);
                }
                ctx.globalAlpha = 1;

                if (gameState === 'playing') {
                    enemies.forEach(e => {
                        if (!e.alive) return;
                        const s = e.size * (1 + Math.sin(e.anim)*0.08);
                        const ox = (e.size - s)/2;
                        ctx.fillStyle = theme.enemy;
                        ctx.fillRect(e.x+ox, e.y+ox, s, s);
                        ctx.strokeStyle = '#444';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(e.x+ox, e.y+ox, s, s);
                    });
                    particles.forEach(p => {
                        ctx.globalAlpha = Math.min(1, p.life/28);
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    });
                    fireballs.forEach(f => {
                        ctx.beginPath(); ctx.arc(f.x,f.y,f.size,0,Math.PI*2);
                        ctx.fillStyle = '#ff4400'; ctx.fill();
                        ctx.beginPath(); ctx.arc(f.x,f.y,f.size*0.55,0,Math.PI*2);
                        ctx.fillStyle = '#ffcc00'; ctx.fill();
                    });
                    if (player.invincible<=0 || Math.floor(player.invincible/3)%2===0) drawPlayer();
                    if (player.slashTimer > 0) {
                        const t = player.slashTimer/16;
                        const cx = player.x+player.size/2, cy = player.y+player.size/2;
                        ctx.beginPath();
                        ctx.arc(cx,cy,66,player.angle-1.2,player.angle+1.2);
                        ctx.strokeStyle = `rgba(150,220,255,${t*0.25})`;
                        ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(cx,cy,58,player.angle-1.0,player.angle+1.0);
                        ctx.strokeStyle = `rgba(230,250,255,${t*0.85})`;
                        ctx.lineWidth = 3; ctx.stroke();
                    }
                    ctx.fillStyle = '#222';
                    ctx.fillRect(20,20,180,18);
                    ctx.fillStyle = player.hp>4 ? '#22cc44' : '#ff3333';
                    ctx.fillRect(20,20,(player.hp/player.maxHp)*180,18);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                    ctx.strokeRect(20,20,180,18);
                    ctx.fillStyle = '#fff';
                    ctx.font = '14px Arial';
                    ctx.textAlign = 'left';
                    ctx.fillText(`HP: ${player.hp}/${player.maxHp}`,28,34);
                    ctx.fillStyle = '#ffcc00';
                    ctx.font = '16px Arial';
                    ctx.fillText(getTheme().name,20,58);
                    ctx.fillText(`Kills: ${kills}/${killsNeeded}  |  Total: ${totalKills}`,20,80);
                }

                if (isPaused && gameState === 'playing') {
                    ctx.fillStyle = 'rgba(0,0,0,0.55)';
                    ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 42px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('PAUSADO', w/2, h/2-10);
                    ctx.font = '18px Arial';
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillText(isMobile ? 'Toque no botão ❚❚ para continuar' : 'Pressione ESPAÇO para continuar', w/2, h/2+35);
                }

                if (gameState === 'dead') {
                    ctx.fillStyle = 'rgba(0,0,0,0.82)';
                    ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = '#ff3333';
                    ctx.font = 'bold 56px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('VOCÊ MORREU', w/2, h/2-90);
                    ctx.fillStyle = '#fff';
                    ctx.font = '22px Arial';
                    ctx.fillText(`Chegou no ${getTheme().name}`, w/2, h/2-35);
                    ctx.fillText(`Total de monstros: ${totalKills}`, w/2, h/2);
                    deathButtons.forEach(btn => {
                        ctx.fillStyle = '#1a1a1a';
                        ctx.fillRect(btn.x,btn.y,btn.w,btn.h);
                        ctx.strokeStyle = '#ff6600';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(btn.x,btn.y,btn.w,btn.h);
                        ctx.fillStyle = '#fff';
                        ctx.font = '20px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(btn.text, btn.x+btn.w/2, btn.y+btn.h/2);
                    });
                }
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        carregarImagens().then(() => {
            gameState = 'title';
            titleAlpha = 1;
            titleTimer = 0;
            dialogIndex = 0;
            gameLoop();
        });
    </script>
</body>
</html>
