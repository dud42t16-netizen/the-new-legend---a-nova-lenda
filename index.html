<head>

<title>The New Legend</title>
<style>

  *{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}

  body{background:#000;overflow:hidden;width:100vw;height:100vh}

  canvas{display:block;position:absolute;top:0;left:0}

  #joystickZone{position:absolute;bottom:25px;left:25px;width:110px;height:110px;pointer-events:auto}

  #joystickBase{width:110px;height:110px;background:rgba(255,255,255,0.11);border:2px solid rgba(255,255,255,0.22);border-radius:50%;position:absolute}

  #joystickKnob{width:50px;height:50px;background:rgba(255,255,255,0.32);border-radius:50%;position:absolute;top:30px;left:30px}

  #pauseBtn{position:absolute;top:15px;right:15px;width:42px;height:42px;background:rgba(0,0,0,0.45);border:2px solid rgba(255,255,255,0.35);border-radius:10px;pointer-events:auto;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;z-index:20}

  #skipBtn{position:absolute;top:15px;right:65px;padding:8px 12px;background:rgba(180,40,40,0.75);border:2px solid #ff6666;border-radius:8px;color:#fff;font-size:13px;font-weight:bold;pointer-events:auto;z-index:25;display:none}

</style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="mobileControls">
    <div id="joystickZone"><div id="joystickBase"></div><div>id="joystickKnob"></div></div>
    <div id="fireBtn">FOGO</div>
    <div id="pauseBtn">❚❚</div>
    </div>
    <button id="skipBtn">Pular Andar</button>
  <script>
      const canvas=document.getElementById('gameCanvas');
      const ctx=canvas.getContext('2d');
      function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
      resizeCanvas();window.addEventListener('resize',resizeCanvas);
      const isMobile=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
      if(isMobile)document.getElementById('mobileControls').style.display='block';

      const SPRITE_PATH='cavaleiro_sprites/';
      const sprites={},portraits={},friendSprites={};
      let tempestasSp=null,tempestasPortrait=null,ignisSp=null,ignisPortrait=null;
      const loadImage=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});

      async function carregarImagens(){
        const lista=['andar_baixo_spritesheet','andar_cima_spritesheet','andar_esquerda_spritesheet','andar_direita_spritesheet','parado_baixo_spritesheet','parado_cima_spritesheet','parado_esquerda_spritesheet','parado_direita_spritesheet','ataque_horizontal_baixo_spritesheet','ataque_horizontal_cima_spritesheet','ataque_horizontal_esquerda_spritesheet','ataque_horizontal_direita_spritesheet'];
        for(const n of lista)sprites[n]=await loadImage(SPRITE_PATH+n+'.png');
        portraits.heros=await loadImage(SPRITE_PATH+'heros.png');
        portraits['mago-anciao']=await loadImage(SPRITE_PATH+'mago-anciao.png');
        portraits.liora=await loadImage(SPRITE_PATH+'liora.png');
        portraits.valeria=await loadImage(SPRITE_PATH+'valeria.png');
        portraits.lucian=await loadImage(SPRITE_PATH+'lucian.png');
        friendSprites.valeria=await loadImage(SPRITE_PATH+'valeriasp.png');
        friendSprites.liora=await loadImage(SPRITE_PATH+'liorasp.png');
        friendSprites.lucian=await loadImage(SPRITE_PATH+'luciansp.png');
        tempestasSp=await loadImage(SPRITE_PATH+'tempestassp.png')||await loadImage('tempestassp.png');
        tempestasPortrait=await loadImage(SPRITE_PATH+'tempestas.png')||await loadImage('tempestas.png');

        if(tempestasPortrait)portraits.tempestas=tempestasPortrait;
        ignisSp=await loadImage(SPRITE_PATH+'ignissp.png')||await loadImage('ignissp.png');
        ignisPortrait=await loadImage(SPRITE_PATH+'ignis.png')||await loadImage('ignis.png');

        if(ignisPortrait)portraits.ignis=ignisPortrait;
      }

      const animConfig={
        andar_baixo:{sheet:'andar_baixo_spritesheet',fw:64,fh:64,frames:8,speed:6},
        andar_cima:{sheet:'andar_cima_spritesheet',fw:64,fh:64,frames:8,speed:6},
        andar_esquerda:{sheet:'andar_esquerda_spritesheet',fw:64,fh:64,frames:8,speed:6},
        andar_direita:{sheet:'andar_direita_spritesheet',fw:64,fh:64,frames:8,speed:6},
        parado_baixo:{sheet:'parado_baixo_spritesheet',fw:64,fh:64,frames:4,speed:18},
        parado_cima:{sheet:'parado_cima_spritesheet',fw:64,fh:64,frames:4,speed:18},
        parado_esquerda:{sheet:'parado_esquerda_spritesheet',fw:64,fh:64,frames:5,speed:18},
        parado_direita:{sheet:'parado_direita_spritesheet',fw:64,fh:64,frames:5,speed:18},
        ataque_baixo:{sheet:'ataque_horizontal_baixo_spritesheet',fw:64,fh:64,frames:5,speed:4},
        ataque_cima:{sheet:'ataque_horizontal_cima_spritesheet',fw:64,fh:64,frames:5,speed:4},
        ataque_esquerda:{sheet:'ataque_horizontal_esquerda_spritesheet',fw:96,fh:64,frames:6,speed:4},
        ataque_direita:{sheet:'ataque_horizontal_direita_spritesheet',fw:96,fh:64,frames:6,speed:4}

      const floors=[

        {name:'Andar 2 - Floresta Sombria',ground:'#1a331a',accent:'#2d5a2d',enemy:'#0a1a0a',type:'normal'},

        {name:'Andar 3 - Caverna de Cristal',ground:'#2a1a4e',accent:'#5a3a8a',enemy:'#0f0520',type:'normal'},

        {name:'Andar 4 - Inferno',ground:'#4a1515',accent:'#8a3030',enemy:'#1a0505',type:'normal'},

        {name:'Andar 5 - Gelo Eterno',ground:'#1a2a3a',accent:'#3a5a7a',enemy:'#051015',type:'normal'},

        {name:'Andar 6 - Ruínas Douradas',ground:'#3d2e10',accent:'#8a6a20',enemy:'#1a1205',type:'normal'},

        {name:'Andar 8 - Colossos',ground:'#2a1a1a',accent:'#5a3030',enemy:'#1a0505',type:'big'},

        {name:'Andar 9 - Titãs',ground:'#1a1a2a',accent:'#30305a',enemy:'#05051a',type:'big'},

        {name:'Andar 10 - Abismo',ground:'#0a0a0a',accent:'#222',enemy:'#000',type:'big'},

        {name:'Andar 20 - Eco',ground:'#1a2a1a',accent:'#2a4a2a',enemy:'#0a150a',type:'scale',count:22},

        {name:'Andar 30 - Profundezas',ground:'#1a1a2a',accent:'#2a2a4a',enemy:'#0a0a15',type:'scale',count:22},

        {name:'Andar 40 - Arcanos',ground:'#2a1a2a',accent:'#4a2a4a',enemy:'#150a15',type:'mage',count:6,hp:8},

        {name:'Andar 50 - Feiticeiros',ground:'#1a0a1a',accent:'#3a1a3a',enemy:'#0a050a',type:'mage',count:7,hp:8},

        {name:'Andar 60 - Corredor das Sombras',ground:'#151520',accent:'#2a2a3a',enemy:'#0a0a12',type:'shadow',count:12,hp:6},

        {name:'Andar 70 - Guardiões',ground:'#201510',accent:'#3a2a18',enemy:'#120a05',type:'guardian',count:50,hp:10},

        {name:'Andar 80 - Colossos Finais',ground:'#1a0a0a',accent:'#3a1515',enemy:'#0a0505',type:'mega',count:3,hp:80},

        {name:'Andar 90 - Portal Negro',ground:'#0d0515',accent:'#2a1040',enemy:'#1a0a2a',type:'mix90',detail:true},

        {name:'Andar 91 - Veias da Torre',ground:'#150510',accent:'#3a1020',enemy:'#200810',type:'late',count:12,hp:13,detail:true},

        {name:'Andar 92 - Núcleo Rachado',ground:'#100515',accent:'#2a1530',enemy:'#180a20',type:'late',count:14,hp:16,detail:true},

        {name:'Andar 93 - Limiar',ground:'#0a0510',accent:'#201028',enemy:'#120818',type:'late',count:16,hp:19,detail:true},

        {name:'Andar 94 - Jardim Invertido',ground:'#061208',accent:'#1a3a22',enemy:'#0a2010',type:'garden',count:14,hp:22,detail:'garden'},

        {name:'Andar 95 - Espelho da Torre',ground:'#0a0a18',accent:'#1a1a3a',enemy:'#101028',type:'mirror',count:10,hp:25,detail:'mirror'},

        {name:'Andar 96 - Último Fôlego',ground:'#120808',accent:'#2a1510',enemy:'#1a0a08',type:'mix96',detail:true},

        {name:'Andar 97 - Limite',ground:'#0a0508',accent:'#1a0a10',enemy:'#120508',type:'mix97',detail:true},

        {name:'Andar 98 - Salão do Eco',ground:'#0c1018',accent:'#1a2840',enemy:'#0a1520',type:'boss98',detail:'echo',allies:true,boss:'tempestas'},

          {name:'Andar 99 - Fornalha',ground:'#1a0800',accent:'#4a1800',enemy:'#2a0a00',type:'boss99',detail:'flames',allies:true,boss:'ignis'},

        {name:'Andar 100 - Trono do Rei',ground:'#0a0508',accent:'#2a1018',enemy:'#1a0808',type:'boss100',detail:'throne',allies:true,boss:'dragon'}

      ];

      let gameState='title',isPaused=false,titleAlpha=1,titleTimer=0,dialogIndex=0;
      let floorIndex=0,killsNeeded=20,kills=0,totalKills=0,enemySpeed=0.55;
      let swordDmg=1,fireDmg=1,maxConcurrent=6,tripleFire=false;
      let swordRange=70,swordHit=58;
      let pendingFloorIndex=0,transitionName='',transitionBtn=null;
      let clearTimer=0,post10Step=0,pendingSpecial=null;
      let spawnQueue=0,spawnTimer=0,totalToSpawn=0;
      let scaleAfter80=0;
      let mixSpawnState={meleeLeft:0,shooterLeft:0};
      let post96Step=0,rescueStep=0,rescueTimer=0;
      let healParticles=[],rescueMonsters=[],friendActors=[],friendShots=[];
      let showFriends=false,dialogFade=0;
      let partyAllies=[];
      let flameParticles=[];

      let tempestasDialogIndex=0;
      let postTempestasIndex=0;
      let ignisDialogIndex=0;
      let postIgnisIndex=0;
      let dragonMode='both',dragonModeTimer=0,dragonWind=0,dragonWindTimer=0,dragonStun=0;
      let dragonGrab=0,dragonGrabMash=0,floorCracks=[],dragonPhase=1,dragonPhaseThreshold=4067;
      let boss=null;
      let bossProjectiles=[];
      let groundMarks=[];
      let fireTrails=[];
      let fireClones=[];
      let lavaZones=[];
      let ringFire=null;
      let barrierY=0;
      let allyShootTimer=0;
      let lucianBalloon=null;
      let lioraBalloon=null;
      let valeriaBalloon=null;
      let openingDone=false;
      let barrierPulse=0;
      let openingWait=0;
      let menuButtons=[];
      let pauseButtons=[];
      let saveMsgTimer=0;
      let hasSave=false;
      let heat=0;
      let heatMax=100;
      let damageBuff=0;
      let damageBuffTimer=0;
      let lucianHealedOnce=false;
      let reflectWindow=0;
      let ignisDown=false;
      let ignisDownDamage=0;
      let ignisOnFire=false;
      let ignisFireTimer=0;
      let lioraBuffGiven=false;

      const player={x:0,y:0,size:48,speed:3.8,baseSpeed:3.8,hp:10,maxHp:10,angle:Math.PI/2,dir:'baixo',state:'parado',frame:0,frameTimer:0,attackCooldown:0,fireCooldown:0,slashTimer:0,invincible:0};
      let enemies=[],fireballs=[],enemyShots=[],particles=[],deathButtons=[];
      const keys={};let mouse={left:false,right:false};
      let joyActive=false,joyTouchId=null,joyDX=0,joyDY=0;
      const joyKnob=document.getElementById('joystickKnob');
      const joyZone=document.getElementById('joystickZone');
      const skipBtn=document.getElementById('skipBtn');

      function currentFloorData(){return floors[floorOrder[floorIndex]]}
      function getTheme(){return currentFloorData()}
      function getAnimKey(){if(player.state==='ataque')return'ataque_'+player.dir;if(player.state==='andar')return'andar_'+player.dir;return'parado_'+player.dir}
      function isLateSpawn(){return floorOrder[floorIndex]>=25}
      function isNarration(d){return !d.speaker||d.speaker===''||(d.portrait===null&&(!d.speaker||d.speaker.trim()===''))}

      function checkSaveExists(){try{return !!localStorage.getItem('tnl_save')}catch(e){return false}}
      function saveGame(){
        const data={floorIndex,kills,totalKills,killsNeeded,enemySpeed,swordDmg,fireDmg,tripleFire,scaleAfter80,swordRange,swordHit,playerHp:player.hp,playerMaxHp:player.maxHp,playerSpeed:player.speed,playerBaseSpeed:player.baseSpeed,dialogIndex};
        try{localStorage.setItem('tnl_save',JSON.stringify(data));hasSave=true;saveMsgTimer=120}catch(e){}
      }

      function loadGame(){
        try{
          const raw=localStorage.getItem('tnl_save');if(!raw)return false;
          const d=JSON.parse(raw);
          floorIndex=d.floorIndex||0;kills=d.kills||0;totalKills=d.totalKills||0;killsNeeded=d.killsNeeded||20;
          enemySpeed=d.enemySpeed||0.55;swordDmg=d.swordDmg||1;fireDmg=d.fireDmg||1;tripleFire=!!d.tripleFire;
          scaleAfter80=d.scaleAfter80||0;swordRange=d.swordRange||70;swordHit=d.swordHit||58;
          player.maxHp=d.playerMaxHp||10;player.hp=d.playerHp||player.maxHp;
          player.baseSpeed=d.playerBaseSpeed||3.8;player.speed=d.playerSpeed||player.baseSpeed;
          player.x=canvas.width/2-player.size/2;player.y=canvas.height/2-player.size/2;
          player.angle=Math.PI/2;player.dir='baixo';player.state='parado';player.frame=0;
          player.attackCooldown=0;player.fireCooldown=0;player.slashTimer=0;player.invincible=30;
          enemies=[];fireballs=[];enemyShots=[];particles=[];deathButtons=[];healParticles=[];
          boss=null;bossProjectiles=[];groundMarks=[];fireTrails=[];fireClones=[];lavaZones=[];ringFire=null;
          lucianBalloon=null;lioraBalloon=null;valeriaBalloon=null;openingDone=false;openingWait=0;heat=0;
          damageBuff=0;damageBuffTimer=0;lucianHealedOnce=false;reflectWindow=0;
          ignisDown=false;ignisDownDamage=0;ignisOnFire=false;ignisFireTimer=0;lioraBuffGiven=false;
          partyAllies=[];flameParticles=[];isPaused=false;skipBtn.style.display='block';
          setupFloorSpawn();gameState='playing';return true;
        }catch(e){return false}
      }

      function drawPlayer(){
        const key=getAnimKey(),conf=animConfig[key];if(!conf)return;
        const sheet=sprites[conf.sheet];
        if(!sheet){ctx.fillStyle='#2060ff';ctx.fillRect(player.x,player.y,player.size,player.size);return}
        const frameToUse=player.state==='parado'?0:Math.min(player.frame,conf.frames-1);
        const fw=conf.fw,fh=conf.fh,sx=frameToUse*fw;
        const drawW=player.size*(fw/64),ox=(drawW-player.size)/2;
        if(damageBuff>0){
          ctx.strokeStyle='rgba(120,220,255,0.6)';ctx.lineWidth=3;
          ctx.strokeRect(player.x-4,player.y-4,player.size+8,player.size+8);
        }
        ctx.drawImage(sheet,sx,0,fw,fh,player.x-ox,player.y,drawW,player.size);
        ctx.font='bold 13px "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif';
        ctx.textAlign='center';
        ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillText('Heros',player.x+player.size/2+1,player.y-8);
        ctx.fillStyle='#e8d5a3';ctx.fillText('Heros',player.x+player.size/2,player.y-9);
      }

      function drawBigMonster(e){
        const cx=e.x+e.size/2,cy=e.y+e.size/2;
        const s=e.size*(1+Math.sin(e.anim)*0.04);
        const pulse=0.5+Math.sin(e.anim*1.5)*0.5;
        const armSwing=Math.sin(e.anim*1.3)*0.22;
        ctx.fillStyle='rgba(0,0,0,0.35)';
        ctx.beginPath();ctx.ellipse(cx,e.y+e.size+4,s*0.42,8,0,0,Math.PI*2);ctx.fill();
        ctx.save();ctx.translate(cx-s*0.38,cy+s*0.02);ctx.rotate(-0.55+armSwing);
        ctx.fillStyle='#2a1212';ctx.beginPath();ctx.moveTo(-s*0.06,0);ctx.lineTo(s*0.06,0);ctx.lineTo(s*0.1,s*0.42);ctx.lineTo(-s*0.1,s*0.42);ctx.closePath();ctx.fill();
        ctx.fillStyle='#1f0e0e';ctx.fillRect(-s*0.09,s*0.38,s*0.18,s*0.18);
        ctx.fillStyle='#150808';ctx.beginPath();ctx.arc(0,s*0.58,s*0.11,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#4a1818';ctx.lineWidth=Math.max(2,s*0.04);ctx.lineCap='round';
        for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*s*0.05,s*0.62);ctx.lineTo(i*s*0.09,s*0.78);ctx.stroke()}
        ctx.restore();
        ctx.save();ctx.translate(cx+s*0.38,cy+s*0.02);ctx.rotate(0.55-armSwing);
        ctx.fillStyle='#2a1212';ctx.beginPath();ctx.moveTo(-s*0.06,0);ctx.lineTo(s*0.06,0);ctx.lineTo(s*0.1,s*0.42);ctx.lineTo(-s*0.1,s*0.42);ctx.closePath();ctx.fill();
        ctx.fillStyle='#1f0e0e';ctx.fillRect(-s*0.09,s*0.38,s*0.18,s*0.18);
        ctx.fillStyle='#150808';ctx.beginPath();ctx.arc(0,s*0.58,s*0.11,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#4a1818';ctx.lineWidth=Math.max(2,s*0.04);ctx.lineCap='round';
        for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*s*0.05,s*0.62);ctx.lineTo(i*s*0.09,s*0.78);ctx.stroke()}
        ctx.restore();
        const bodyGrad=ctx.createRadialGradient(cx-s*0.15,cy-s*0.2,s*0.1,cx,cy,s*0.55);
        bodyGrad.addColorStop(0,'#4a3030');bodyGrad.addColorStop(0.45,'#2a1515');bodyGrad.addColorStop(1,'#120808');
        ctx.fillStyle=bodyGrad;
        ctx.beginPath();
        ctx.moveTo(cx-s*0.42,cy+s*0.35);ctx.quadraticCurveTo(cx-s*0.5,cy-s*0.1,cx-s*0.28,cy-s*0.4);
        ctx.quadraticCurveTo(cx,cy-s*0.52,cx+s*0.28,cy-s*0.4);ctx.quadraticCurveTo(cx+s*0.5,cy-s*0.1,cx+s*0.42,cy+s*0.35);
        ctx.quadraticCurveTo(cx,cy+s*0.48,cx-s*0.42,cy+s*0.35);ctx.fill();
        ctx.strokeStyle='#5a4040';ctx.lineWidth=2.5;
        ctx.beginPath();ctx.moveTo(cx-s*0.3,cy-s*0.15);ctx.lineTo(cx-s*0.1,cy+s*0.2);ctx.moveTo(cx+s*0.3,cy-s*0.15);ctx.lineTo(cx+s*0.1,cy+s*0.2);ctx.moveTo(cx-s*0.2,cy+s*0.1);ctx.lineTo(cx+s*0.2,cy+s*0.1);ctx.stroke();
        ctx.fillStyle='#1a0a0a';
        ctx.beginPath();ctx.moveTo(cx-s*0.22,cy-s*0.38);ctx.quadraticCurveTo(cx-s*0.38,cy-s*0.7,cx-s*0.15,cy-s*0.55);ctx.quadraticCurveTo(cx-s*0.18,cy-s*0.45,cx-s*0.22,cy-s*0.38);ctx.fill();
        ctx.beginPath();ctx.moveTo(cx+s*0.22,cy-s*0.38);ctx.quadraticCurveTo(cx+s*0.38,cy-s*0.7,cx+s*0.15,cy-s*0.55);ctx.quadraticCurveTo(cx+s*0.18,cy-s*0.45,cx+s*0.22,cy-s*0.38);ctx.fill();
        const eyeGlow=ctx.createRadialGradient(cx-s*0.14,cy-s*0.12,1,cx-s*0.14,cy-s*0.12,s*0.12);
        eyeGlow.addColorStop(0,`rgba(255,40,40,${0.7+pulse*0.3})`);eyeGlow.addColorStop(1,'rgba(180,0,0,0)');
        ctx.fillStyle=eyeGlow;ctx.beginPath();ctx.arc(cx-s*0.14,cy-s*0.12,s*0.12,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(cx+s*0.14,cy-s*0.12,s*0.12,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ff2222';
        ctx.beginPath();ctx.ellipse(cx-s*0.14,cy-s*0.12,s*0.06,s*0.04,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(cx+s*0.14,cy-s*0.12,s*0.06,s*0.04,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#3a1010';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx-s*0.15,cy+s*0.12);ctx.quadraticCurveTo(cx,cy+s*0.22,cx+s*0.15,cy+s*0.12);ctx.stroke();
        ctx.fillStyle='#1a0a0a';ctx.fillRect(cx-s*0.32,cy+s*0.32,s*0.14,s*0.18);ctx.fillRect(cx+s*0.18,cy+s*0.32,s*0.14,s*0.18);
        ctx.fillStyle='#4a2020';
        ctx.fillRect(cx-s*0.34,cy+s*0.48,s*0.06,s*0.06);ctx.fillRect(cx-s*0.22,cy+s*0.48,s*0.06,s*0.06);
        ctx.fillRect(cx+s*0.16,cy+s*0.48,s*0.06,s*0.06);ctx.fillRect(cx+s*0.28,cy+s*0.48,s*0.06,s*0.06);

      function updateFlameParticles(){
        if(getTheme().detail!=='flames')return;
        if(Math.random()<0.4)flameParticles.push({x:Math.random()*canvas.width,y:canvas.height*0.75+Math.random()*canvas.height*0.2,vy:-0.8-Math.random()*1.5,vx:(Math.random()-0.5)*0.6,life:40+Math.random()*40,size:2+Math.random()*4,hue:20+Math.random()*30});
        for(let i=flameParticles.length-1;i>=0;i--){const p=flameParticles[i];p.x+=p.vx;p.y+=p.vy;p.life--;p.size*=0.98;if(p.life<=0||p.size<0.5)flameParticles.splice(i,1)}
      }

      function drawFlameParticles(){
        flameParticles.forEach(p=>{
          ctx.globalAlpha=Math.min(1,p.life/35);
          const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*2);
          g.addColorStop(0,`hsla(${p.hue},100%,70%,0.9)`);g.addColorStop(1,`hsla(${p.hue},100%,40%,0)`);
          ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
        });
      }

      function drawFloorBackground(theme){
        const w=canvas.width,h=canvas.height;
        if(theme.detail==='echo'){drawEchoFloor();return}

          ctx.fillStyle=theme.ground;ctx.fillRect(0,0,w,h);

        }else if(theme.detail==='mirror'){
          ctx.fillStyle=theme.ground;ctx.fillRect(0,0,w,h);
          ctx.fillStyle='rgba(80,80,140,0.08)';

        if(!ignisSp)return;
        const img=ignisSp;const scale=maxH/img.height;const dw=img.width*scale;
        if(ignisOnFire){
          const g=ctx.createRadialGradient(x+dw/2,y+maxH*0.5,5,x+dw/2,y+maxH*0.5,maxH*0.9);

        g2.addColorStop(0,'rgba(255,120,20,0.35)');g2.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g2;ctx.beginPath();ctx.arc(x+dw/2,y+maxH*0.45,maxH*0.7,0,Math.PI*2);ctx.fill();

        if(ignisDown){

      function drawDialogBox(speaker,text,portraitKey){
        const w=canvas.width,h=canvas.height;
        if(portraitKey&&portraits[portraitKey]){
          const img=portraits[portraitKey];
          const maxH=Math.min(h*0.42,300);
          const scale=maxH/img.height;
          ctx.drawImage(img,(w-img.width*scale)/2,h*0.04,img.width*scale,img.height*scale);
        }
        const boxH=Math.min(190,h*0.34),boxY=h-boxH-14,boxX=14,boxW=w-28;
        ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(boxX,boxY,boxW,boxH);

        const maxWidth=boxW-28;const words=text.split(' ');

        let line='',ly=boxY+(speaker?48:30);

      function drawSpeechBalloon(x,y,text,borderColor){
        ctx.font='bold 14px Arial';
        const tw=Math.min(ctx.measureText(text).width,260);
        const bw=tw+36,bh=40;
        const bx=x-bw/2,by=y-bh-14;
        ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.roundRect(bx+3,by+3,bw,bh,11);ctx.fill();
        ctx.fillStyle='rgba(8,6,16,0.96)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,11);ctx.fill();
        ctx.strokeStyle=borderColor;ctx.lineWidth=3.5;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,11);ctx.stroke();
        ctx.fillStyle='rgba(8,6,16,0.96)';
        ctx.beginPath();ctx.moveTo(x-9,by+bh);ctx.lineTo(x,by+bh+12);ctx.lineTo(x+9,by+bh);ctx.fill();
        ctx.strokeStyle=borderColor;ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(x-9,by+bh);ctx.lineTo(x,by+bh+12);ctx.lineTo(x+9,by+bh);ctx.stroke();
        ctx.fillStyle='#ffffff';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(text,x,by+bh/2+1);
      }

        ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.ellipse(cx,b.y+b.h+8,b.w*0.45,14,0,0,Math.PI*2);ctx.fill();
        [[-1,-0.6],[1,0.6]].forEach(([side,baseRot])=>{
          ctx.save();ctx.translate(cx+side*40*scale,cy-20*scale);ctx.rotate(side*baseRot+side*wing);
          ctx.fillStyle='#3a1218';
          ctx.beginPath();ctx.moveTo(0,0);
          ctx.quadraticCurveTo(side*-80*scale,-60*scale,side*-140*scale,10*scale);
          ctx.quadraticCurveTo(side*-100*scale,50*scale,side*-40*scale,30*scale);
          ctx.quadraticCurveTo(side*-20*scale,15*scale,0,0);ctx.fill();
          ctx.restore();
        });
        ctx.fillStyle='#3a1018';ctx.beginPath();ctx.ellipse(cx,cy,70*scale,55*scale,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#4a1820';ctx.beginPath();ctx.ellipse(cx+20*scale,cy-105*scale,32*scale,24*scale,0.2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ff2222';ctx.beginPath();ctx.ellipse(cx+28*scale,cy-107*scale,5*scale,3.5*scale,0,0,Math.PI*2);ctx.fill();
        if(stunned){
          ctx.strokeStyle='rgba(255,220,80,0.7)';ctx.lineWidth=4;ctx.strokeRect(b.x-8,b.y-8,b.w+16,b.h+16);
          ctx.fillStyle='rgba(255,230,100,0.9)';ctx.font='bold 16px Arial';ctx.textAlign='center';
          ctx.fillText('DESNORTEADO!',cx,b.y-14);
        }
      }

     function updateDragon(){
        if(!boss||boss.kind!=='dragon'||boss.hp<=0)return;
        boss.anim++;
        if(dragonStun>0){dragonStun--;return}
        dragonModeTimer--;
        if(dragonModeTimer<=0){
          dragonMode=['both','sword','magic'][Math.floor(Math.random()*3)];
          dragonModeTimer=300+Math.random()*200;
          if(dragonMode==='sword')lioraBalloon={text:'Só a espada funciona agora!',timer:120};
          else if(dragonMode==='magic')valeriaBalloon={text:'Use magia! A espada não corta!',timer:120};
        }
        boss.windCd=Math.max(0,(boss.windCd||0)-1);
        if(boss.windCd<=0&&Math.random()<0.008){
          dragonWind=Math.random()<0.5?-1:1;dragonWindTimer=90+Math.random()*60;boss.windCd=200;
          lioraBalloon={text:'Vento! Segure firme!',timer:100};
        }
        if(dragonWindTimer>0){dragonWindTimer--;player.x+=dragonWind*2.2;if(dragonWindTimer<=0)dragonWind=0}
        boss.crackCd=Math.max(0,(boss.crackCd||0)-1);
        if(boss.crackCd<=0&&floorCracks.length<4&&Math.random()<0.01){
          floorCracks.push({x:60+Math.random()*(canvas.width-120),y:canvas.height*0.45+Math.random()*canvas.height*0.25,w:40+Math.random()*50,h:12,life:240,dmg:8});
          boss.crackCd=160;
        }
        for(let i=floorCracks.length-1;i>=0;i--){
          const c=floorCracks[i];c.life--;
          if(player.invincible<=0&&player.x+player.size>c.x&&player.x<c.x+c.w&&player.y+player.size>c.y&&player.y<c.y+c.h){
            player.hp-=c.dmg;player.invincible=35;
            if(player.hp<=0){player.hp=0;gameState='dead';createDeathButtons()}
          }
          if(c.life<=0)floorCracks.splice(i,1);
        }
        boss.grabCd=Math.max(0,(boss.grabCd||0)-1);
        if(dragonGrab<=0&&boss.grabCd<=0&&Math.random()<0.004){
          if(Math.hypot(player.x+player.size/2-(boss.x+boss.w/2),player.y+player.size/2-(boss.y+boss.h*0.6))<160){
            dragonGrab=180;dragonGrabMash=0;boss.grabCd=320;
            valeriaBalloon={text:'Heros! Ataca rápido pra se soltar!',timer:120};
          }
        }
        if(dragonGrab>0){
          dragonGrab--;player.hp-=0.12;
          if(dragonGrabMash>=40||dragonGrab<=0){dragonGrab=0;dragonGrabMash=0;player.invincible=40}
          if(player.hp<=0){player.hp=0;gameState='dead';createDeathButtons()}
        }
        boss.shootCd=Math.max(0,(boss.shootCd||0)-1);
        if(boss.shootCd<=0){
          boss.shootCd=70+Math.random()*40;
          const ang=Math.atan2(player.y+player.size/2-(boss.y+boss.h*0.4),player.x+player.size/2-(boss.x+boss.w/2));
          for(let i=-1;i<=1;i++)bossProjectiles.push({type:'ember',x:boss.x+boss.w/2,y:boss.y+boss.h*0.35,vx:Math.cos(ang+i*0.2)*4.2,vy:Math.sin(ang+i*0.2)*4.2,size:11,life:100,dmg:12});
        }
        boss.reflectCd=Math.max(0,(boss.reflectCd||0)-1);
        if(boss.reflectCd<=0&&Math.random()<0.006){
          boss.reflectCd=480;
          const ang=Math.atan2(player.y+player.size/2-(boss.y+boss.h*0.4),player.x+player.size/2-(boss.x+boss.w/2));
          bossProjectiles.push({type:'reflectable',x:boss.x+boss.w/2,y:boss.y+boss.h*0.35,vx:Math.cos(ang)*2.8,vy:Math.sin(ang)*2.8,size:20,life:180,dmg:16,reflected:false});
          reflectWindow=130;lioraBalloon={text:'Heros! Rebata essa magia!',timer:130};
        }
        allyShootTimer--;
        if(allyShootTimer<=0){
          allyShootTimer=600;
          partyAllies.forEach(a=>{bossProjectiles.push({type:'ally',x:a.x,y:a.y+10,vx:0,vy:0,size:9,life:160,dmg:5,home:true})});
        }
        if(lucianBalloon){lucianBalloon.timer--;if(lucianBalloon.timer<=0)lucianBalloon=null}
        if(lioraBalloon){lioraBalloon.timer--;if(lioraBalloon.timer<=0)lioraBalloon=null}
        if(valeriaBalloon){valeriaBalloon.timer--;if(valeriaBalloon.timer<=0)valeriaBalloon=null}
      }

      function spawnOneEnemy(){
        const f=currentFloorData();
        let size=28,hp=1,spd=enemySpeed,dmg=1,canShoot=false,kind='normal';

        else if(f.type==='mage'){size=42;hp=f.hp||8;spd=0.36;dmg=5;canShoot=true}
        else if(f.type==='scale'){size=32;hp=3;spd=enemySpeed*1.12;dmg=2}
        else if(f.type==='shadow'){size=34;hp=f.hp||6;spd=0.62;dmg=4}
        else if(f.type==='guardian'){size=36;hp=(f.hp||10)+sc;spd=0.55;dmg=5+sc+extraDmg}
        else if(f.type==='mega'){size=90;hp=(f.hp||80)+sc;spd=1.1;dmg=22+sc+extraDmg;kind='mega'}
        else if(f.type==='mix90'){
          const hasShooter=enemies.filter(e=>e.alive&&e.canShoot).length;
          if(mixSpawnState.shooterLeft>0&&hasShooter<1){mixSpawnState.shooterLeft--;size=40;hp=10+sc;spd=0.34;dmg=6+sc+extraDmg;canShoot=true}
          else{mixSpawnState.meleeLeft=Math.max(0,mixSpawnState.meleeLeft-1);size=32;hp=10+sc;spd=0.58;dmg=5+sc+extraDmg}
        }
        else if(f.type==='mix96'){
          const shootersAlive=enemies.filter(e=>e.alive&&e.canShoot).length;
          const meleeAlive=enemies.filter(e=>e.alive&&!e.canShoot).length;
          if(mixSpawnState.shooterLeft>0&&shootersAlive<2){mixSpawnState.shooterLeft--;size=40;hp=12+sc;spd=0.34;dmg=7+sc+extraDmg;canShoot=true}
          else if(mixSpawnState.meleeLeft>0&&meleeAlive<5){mixSpawnState.meleeLeft--;size=26;hp=8+sc;spd=0.85;dmg=5+sc+extraDmg}
          else if(mixSpawnState.shooterLeft>0){mixSpawnState.shooterLeft--;size=40;hp=12+sc;spd=0.34;dmg=7+sc+extraDmg;canShoot=true}
          else{mixSpawnState.meleeLeft=Math.max(0,mixSpawnState.meleeLeft-1);size=26;hp=8+sc;spd=0.85;dmg=5+sc+extraDmg}
        }
        else if(f.type==='mix97'){
          const shootersAlive=enemies.filter(e=>e.alive&&e.canShoot).length;
          const meleeAlive=enemies.filter(e=>e.alive&&!e.canShoot).length;
          if(mixSpawnState.shooterLeft>0&&shootersAlive<2){mixSpawnState.shooterLeft--;size=40;hp=12+sc;spd=0.34;dmg=7+sc+extraDmg;canShoot=true}
          else if(mixSpawnState.meleeLeft>0&&meleeAlive<5){mixSpawnState.meleeLeft--;size=70;hp=18+sc;spd=0.45;dmg=8+sc+extraDmg;kind='big'}
          else if(mixSpawnState.shooterLeft>0){mixSpawnState.shooterLeft--;size=40;hp=12+sc;spd=0.34;dmg=7+sc+extraDmg;canShoot=true}
          else{mixSpawnState.meleeLeft=Math.max(0,mixSpawnState.meleeLeft-1);size=70;hp=18+sc;spd=0.45;dmg=8+sc+extraDmg;kind='big'}
        }
        else if(f.type==='late'){size=34;hp=(f.hp||13)+sc;spd=0.58;dmg=7+sc+extraDmg}
        else if(f.type==='garden'){size=36;hp=(f.hp||22)+sc;spd=0.5;dmg=7+sc+extraDmg}
        else if(f.type==='mirror'){size=38;hp=(f.hp||25)+sc;spd=0.52;dmg=8+sc+extraDmg;canShoot=Math.random()>0.5}
        else{hp=1+sc;dmg=1+sc+extraDmg;spd=enemySpeed+sc*0.03}

        let side=isLateSpawn()?Math.floor(Math.random()*3):Math.floor(Math.random()*4);
        let x,y;
        if(side===0){x=Math.random()*canvas.width;y=-size-20}
        else if(side===1){x=canvas.width+size+20;y=Math.random()*canvas.height*0.7}
        else if(side===2){x=-size-20;y=Math.random()*canvas.height*0.7}
        else{x=Math.random()*canvas.width;y=canvas.height+size+20}
        enemies.push({x,y,size,hp,maxHp:hp,speed:spd,damage:dmg,alive:true,anim:Math.random()*Math.PI*2,canShoot,shootCd:canShoot?(80+Math.random()*50):0,kind});
      }

      function createFireball(){
        if(player.fireCooldown>0||isPaused)return;
        if(boss&&boss.kind==='dragon'&&dragonMode==='sword')return;
        const speed=9.5,base=player.angle;
        const angles=tripleFire?[base-0.28,base,base+0.28]:[base];
        const extra=damageBuff>0?2:0;
        angles.forEach(a=>{fireballs.push({x:player.x+player.size/2,y:player.y+player.size/2,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,size:13,life:85,dmg:fireDmg+extra})});
        player.fireCooldown=28;
      }

      function swordAttack(){

        if(player.attackCooldown>0||player.state==='ataque'||isPaused)return;
        player.state='ataque';player.frame=0;player.frameTimer=0;player.attackCooldown=22;player.slashTimer=16;
        if(dragonGrab>0){dragonGrabMash+=8;player.attackCooldown=8;return}
        if(boss&&boss.kind==='dragon'&&dragonMode==='magic')return;

        const ax=player.x+player.size/2+Math.cos(player.angle)*(swordRange*0.55);
        const ay=player.y+player.size/2+Math.sin(player.angle)*(swordRange*0.55);
        const extra=damageBuff>0?2:0;
        enemies.forEach(e=>{if(!e.alive)return;const dx=e.x+e.size/2-ax,dy=e.y+e.size/2-ay;if(Math.sqrt(dx*dx+dy*dy)<swordHit+(e.size-28)*0.25)damageEnemy(e,swordDmg+extra)});
        for(let i=fireClones.length-1;i>=0;i--){
          const c=fireClones[i];
          if(Math.hypot(c.x-ax,c.y-ay)<swordHit+20){fireClones.splice(i,1);for(let k=0;k<8;k++)particles.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,size:3,life:18,color:'#ff6600'})}
        }
        // REBATE mais generoso
        if(reflectWindow>0){
          for(let i=bossProjectiles.length-1;i>=0;i--){
            const p=bossProjectiles[i];
            if(p.type==='reflectable'&&!p.reflected){
              const dist=Math.hypot(p.x-ax,p.y-ay);
              if(dist<swordHit+55){ // área bem maior
                p.reflected=true;
                p.life=140;
                const tx=boss.x+boss.w/2,ty=boss.y+boss.h*0.5;
                const d=Math.hypot(tx-p.x,ty-p.y)||1;
                p.vx=(tx-p.x)/d*8.5;
                p.vy=(ty-p.y)/d*8.5;
                reflectWindow=0;
                for(let k=0;k<16;k++)particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,size:3,life:24,color:'#88ffaa'});
              }
            }
          }
        }

          if(boss&&boss.hp>0){
            const bx=boss.x+boss.w/2,by=boss.y+boss.h*(boss.kind==='dragon'?0.55:(ignisDown?0.7:0.5));
            const hitR=boss.kind==='dragon'?swordHit+90:swordHit+50;
            const dx=bx-ax,dy=by-ay;
            if(Math.sqrt(dx*dx+dy*dy)<hitR){
              let dmg=boss.kind==='ignis'?swordDmg+1+extra:boss.kind==='dragon'?swordDmg+2+extra:swordDmg+extra;
              if(boss.kind==='ignis'&&ignisDown){
                ignisDownDamage+=dmg;boss.hp-=dmg;
                if(ignisDownDamage>=100){ignisDown=false;ignisOnFire=true;ignisFireTimer=360;valeriaBalloon={text:'Sai de perto! Ele pegou fogo!',timer:180}}
              }else if(boss.kind==='dragon'){
                if(dragonStun>0)dmg+=4;
                boss.hp-=dmg;
                if(boss.hp<=dragonPhaseThreshold&&dragonPhase===1)onDragonPhaseEnd();
                else if(boss.hp<=0){boss.hp=0;onBossDefeated()}
              }else{
                boss.hp-=dmg;
              }
              for(let i=0;i<5;i++)particles.push({x:bx,y:by,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,size:3,life:15,color:boss.kind==='dragon'?'#ff4060':boss.kind==='ignis'?'#ff4400':'#c080ff'});
              if(boss&&boss.hp<=0){boss.hp=0;onBossDefeated()}
            }
          }

      }

      function damageEnemy(enemy,dmg){
        enemy.hp-=dmg;
        if(enemy.hp<=0){
          enemy.alive=false;kills++;totalKills++;
          for(let i=0;i<8;i++)particles.push({x:enemy.x+enemy.size/2,y:enemy.y+enemy.size/2,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,size:3+Math.random()*3,life:22+Math.random()*12,color:`hsl(${Math.random()*40+10},85%,55%)`});
          checkFloorClear();
        }
      }

      function onBossDefeated(){
        totalKills++;
        const kind=boss?boss.kind:'';
        const bx=boss?boss.x+boss.w/2:0,by=boss?boss.y+boss.h/2:0;
        for(let i=0;i<45;i++)particles.push({x:bx,y:by,vx:(Math.random()-0.5)*9,vy:(Math.random()-0.5)*9,size:3+Math.random()*4,life:35+Math.random()*20,color:kind==='ignis'?`hsl(${15+Math.random()*25},100%,55%)`:kind==='dragon'?`hsl(${Math.random()*20},90%,50%)`:`hsl(${270+Math.random()*40},80%,60%)`});
        boss=null;bossProjectiles=[];groundMarks=[];fireTrails=[];fireClones=[];lavaZones=[];ringFire=null;heat=0;
        damageBuff=0;ignisDown=false;ignisOnFire=false;reflectWindow=0;dragonStun=0;dragonGrab=0;floorCracks=[];
        if(kind==='ignis'){postIgnisIndex=0;gameState='post_ignis';skipBtn.style.display='none'}
        else if(kind==='dragon'){gameState='floor_clear';clearTimer=180;pendingSpecial=null}
        else{postTempestasIndex=0;gameState='post_tempestas';skipBtn.style.display='none'}
      }

      function checkFloorClear(){
        const f=currentFloorData();
        if(f.type==='empty'||f.type==='boss98'||f. type==='boss99'||f.type==='boss100')return;
        const alive=enemies.some(e=>e.alive);
        if(!alive&&spawnQueue<=0&&kills>=killsNeeded){
          pendingSpecial=null;
          if(f.name.includes('Andar 10'))pendingSpecial='post10';
          else if(f.name.includes('Andar 50'))pendingSpecial='post50';
          else if(f.name.includes('Andar 60'))pendingSpecial='post60';
          else if(f.name.includes('Andar 80'))pendingSpecial='post80';
          else if(f.name.includes('Andar 93'))pendingSpecial='post93';
          else if(f.name.includes('Andar 96'))pendingSpecial='post96';
          else if(f.name.includes('Andar 97'))pendingSpecial='pre_rescue';
          gameState='floor_clear';clearTimer=180;
        }
      }

      function afterClearSequence(){
        if(pendingSpecial==='dragon_phase2_placeholder'){
          player.hp=player.maxHp;
          if(boss){boss.hp=dragonPhaseThreshold;dragonPhase=1}
          pendingSpecial=null;gameState='playing';
        valeriaBalloon={text:'Ainda não acabou... prepare-se!',timer:150};
        return;
        }
        if(pendingSpecial==='post10'){post10Step=0;gameState='post10';pendingSpecial=null;return}
        if(pendingSpecial==='post50'){gameState='post50';pendingSpecial=null;return}
        if(pendingSpecial==='post60'){gameState='post60';pendingSpecial=null;return}
        if(pendingSpecial==='post80'){gameState='post80';pendingSpecial=null;return}
        if(pendingSpecial==='post93'){gameState='post93';pendingSpecial=null;return}
        if(pendingSpecial==='post96'){post96Step=0;gameState='post96';pendingSpecial=null;return}
        if(pendingSpecial==='pre_rescue'){gameState='pre_rescue';pendingSpecial=null;return}

      }

      function hitboxTouch(m){const hs=44;return m.x<player.x+hs&&m.x+m.size>player.x&&m.y<player.y+hs&&m.y+m.size>player.y}

      function goToTransition(){
        pendingFloorIndex=floorIndex+1;
        if(pendingFloorIndex>=floorOrder.length){gameState='victory';transitionBtn=null;skipBtn.style.display='none';return}
        transitionName=floors[floorOrder[pendingFloorIndex]].name;
        const cx=canvas.width/2,cy=canvas.height/2;
        transitionBtn={text:'Próximo Andar',x:cx-120,y:cy+50,w:240,h:48};
        gameState='floor_transition';
      }

      function applyNextFloor(){
        floorIndex=pendingFloorIndex;
        const f=currentFloorData();
        if(floorOrder[floorIndex]>=12){player.speed=player.baseSpeed*1.12;swordRange=82;swordHit=66}
        else{player.speed=player.baseSpeed;swordRange=70;swordHit=58}
        if(floorOrder[floorIndex]>=11){swordDmg=2;fireDmg=3}
        if(floorOrder[floorIndex]>=14){tripleFire=true}
        if(floorOrder[floorIndex]>=15){const extra=floorOrder[floorIndex]-14;swordDmg=2+extra;fireDmg=3+extra;tripleFire=true}
        if(floorOrder[floorIndex]>=16)scaleAfter80=floorOrder[floorIndex]-15;else scaleAfter80=0;
        if(f.type==='normal'||f.type==='scale'){
          if(floorIndex<3){killsNeeded=Math.floor(killsNeeded*1.8);enemySpeed*=1.25}
          else if(floorIndex===3){killsNeeded=Math.floor(killsNeeded*1.4);enemySpeed*=1.15}
          else if(f.type==='scale')enemySpeed*=1.08;
        }
        player.maxHp=10+floorIndex*10;player.hp=player.maxHp;
        player.x=canvas.width/2-player.size/2;player.y=canvas.height/2-player.size/2;
        player.state='parado';player.frame=0;player.attackCooldown=0;player.fireCooldown=0;player.slashTimer=0;player.invincible=45;
        transitionBtn=null;setupFloorSpawn();
        if(gameState!=='tempestas_dialog'&&gameState!=='ignis_dialog'){gameState='playing';skipBtn.style.display='block'}
      }

      function forceSkipFloor(){
        if(gameState!=='playing')return;
        if(boss){boss.hp=0;onBossDefeated();return}
        if(currentFloorData().type==='empty'){goToTransition();return}
        enemies.forEach(e=>e.alive=false);spawnQueue=0;kills=killsNeeded;checkFloorClear();
      }

      function resetGame(){startGameplay()}

      function restartFloor(){
        kills=0;isPaused=false;player.hp=player.maxHp;
        player.x=canvas.width/2-player.size/2;player.y=canvas.height/2-player.size/2;
        player.state='parado';player.frame=0;player.attackCooldown=0;player.fireCooldown=0;player.slashTimer=0;player.invincible=0;
        enemies=[];fireballs=[];enemyShots=[];particles=[];deathButtons=[];heat=0;
        damageBuff=0;lucianHealedOnce=false;reflectWindow=0;
        ignisDown=false;ignisDownDamage=0;ignisOnFire=false;lioraBuffGiven=false;
        dragonStun=0;dragonGrab=0;floorCracks=[];dragonMode='both';
        if(currentFloorData().type==='boss98')startTempestasBattle();
        else if(currentFloorData().type==='boss99')startIgnisBattle();
        else if(currentFloorData().type==='boss100')startDragonBattle();
        else setupFloorSpawn();
        gameState='playing';
      }

      function createDeathButtons(){
        const cx=canvas.width/2,cy=canvas.height/2;
        deathButtons=[
          {text:'Reiniciar Andar',x:cx-130,y:cy+50,w:260,h:48,action:()=>restartFloor()},
          {text:'Reiniciar do Início',x:cx-130,y:cy+115,w:260,h:48,action:()=>resetGame()}
        ];
      }

      function togglePause(){if(gameState!=='playing')return;isPaused=!isPaused;if(isPaused)setupPauseButtons()}
      function hitButton(mx,my,btn){return btn&&mx>=btn.x&&mx<=btn.x+btn.w&&my>=btn.y&&my<=btn.y+btn.h}

      function onAdvance(){
        if(['present_heros','story','meeting','friends','tower'].includes(gameState)){advanceDialog();return}

        if(gameState==='post10'){post10Step++;if(post10Step>=3)goToTransition();return}

        if(['post50','post60','post80','post93'].includes(gameState)){goToTransition();return}

        if(gameState==='post96'){post96Step++;if(post96Step>=2)goToTransition();return}

        if(gameState==='pre_rescue'){startRescueCutscene();return}

        if(gameState==='tempestas_dialog'){
          tempestasDialogIndex++;
          if(tempestasDialogIndex>=tempestasDialogs.length)startTempestasBattle();
          return;
        }
        if(gameState==='post_tempestas'){
          postTempestasIndex++;
          if(postTempestasIndex>=postTempestasDialogs.length)goToTransition();
          return;
        }
        if(gameState==='ignis_dialog'){
          ignisDialogIndex++;
          if(ignisDialogIndex>=ignisDialogs.length)startIgnisBattle();
          return;
        }

        if(gameState==='post_ignis'){
          postIgnisIndex++;
          if(postIgnisIndex>=postIgnisDialogs.length)goToTransition();
          return;
        }

        if(gameState==='rescue'){
          if(rescueStep<4)return;
          if(rescueStep===4){
            rescueStep=5;rescueTimer=0;
            for(let i=0;i<50;i++)healParticles.push({x:player.x+22+(Math.random()-0.5)*40,y:player.y+18+(Math.random()-0.5)*30,vx:(Math.random()-0.5)*1.3,vy:-1.1-Math.random()*2,life:40+Math.random()*40,size:2+Math.random()*4,color:`hsla(${100+Math.random()*40},95%,65%,0.95)`});
            player.hp=player.maxHp;return;
          }
          if(rescueStep===5){rescueStep=6;return}
          if(rescueStep>=6){rescueStep++;if(rescueStep-6>=rescueDialogs.length)goToTransition()}
          return;
        }
        if(gameState==='victory'){gameState='menu';setupMenuButtons()}
      }

      skipBtn.addEventListener('click',e=>{e.preventDefault();forceSkipFloor()});
      skipBtn.addEventListener('touchstart',e=>{e.preventDefault();forceSkipFloor()},{passive:false});
      window.addEventListener('keydown',e=>{
        keys[e.code]=true;
        if(e.code==='Space'){e.preventDefault();if(gameState==='playing')togglePause();else if(gameState==='floor_transition')applyNextFloor();else if(gameState!=='floor_clear'&&gameState!=='menu')onAdvance()}
        if(e.code==='Enter'||e.code==='KeyZ'){if(gameState==='floor_transition')applyNextFloor();else if(gameState!=='floor_clear'&&gameState!=='menu')onAdvance()}
      });
      window.addEventListener('keyup',e=>keys[e.code]=false);
      canvas.addEventListener('mousedown',e=>{
        e.preventDefault();
        const rect=canvas.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
        if(gameState==='menu'){menuButtons.forEach(b=>{if(!b.disabled&&hitButton(mx,my,b))b.action()});return}
        if(gameState==='playing'&&isPaused){pauseButtons.forEach(b=>{if(hitButton(mx,my,b))b.action()});return}
        if(gameState==='dead'){deathButtons.forEach(b=>{if(hitButton(mx,my,b))b.action()});return}
        if(gameState==='floor_transition'){if(hitButton(mx,my,transitionBtn))applyNextFloor();return}
        if(gameState==='floor_clear')return;
        if(['present_heros','story','meeting','friends','tower','post10','post50','post60','post80','post93','post96','pre_rescue','rescue','tempestas_dialog','post_tempestas','ignis_dialog','post_ignis','victory'].includes(gameState)){onAdvance();return}
        if(gameState==='playing'&&!isPaused){if(e.button===0)mouse.left=true;if(e.button===2)mouse.right=true}
      });
      canvas.addEventListener('mouseup',e=>{if(e.button===0)mouse.left=false;if(e.button===2)mouse.right=false});
      canvas.addEventListener('contextmenu',e=>e.preventDefault());
      joyZone.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();if(joyActive||isPaused||gameState!=='playing')return;const t=e.changedTouches[0];joyActive=true;joyTouchId=t.identifier;handleJoy(t)},{passive:false});
      joyZone.addEventListener('touchmove',e=>{e.preventDefault();e.stopPropagation();if(!joyActive)return;for(let t of e.changedTouches)if(t.identifier===joyTouchId){handleJoy(t);break}},{passive:false});
      function endJoy(e){for(let t of e.changedTouches)if(t.identifier===joyTouchId){joyActive=false;joyTouchId=null;joyDX=0;joyDY=0;joyKnob.style.top='30px';joyKnob.style.left='30px';break}}
      joyZone.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();endJoy(e)},{passive:false});
      joyZone.addEventListener('touchcancel',e=>{e.preventDefault();endJoy(e)},{passive:false});
      function handleJoy(touch){const rect=joyZone.getBoundingClientRect();const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;let dx=touch.clientX-cx,dy=touch.clientY-cy;const dist=Math.sqrt(dx*dx+dy*dy),maxD=38;if(dist>maxD){dx=dx/dist*maxD;dy=dy/dist*maxD}joyKnob.style.left=(30+dx)+'px';joyKnob.style.top=(30+dy)+'px';joyDX=dx/maxD;joyDY=dy/maxD}
      document.getElementById('fireBtn').addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();if(gameState==='playing'&&!isPaused)createFireball()},{passive:false});
      document.getElementById('pauseBtn').addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();if(gameState==='playing')togglePause()},{passive:false});
      canvas.addEventListener('touchstart',e=>{
        e.preventDefault();
        const t=e.changedTouches[0];const rect=canvas.getBoundingClientRect();const mx=t.clientX-rect.left,my=t.clientY-rect.top;
        if(gameState==='menu'){menuButtons.forEach(b=>{if(!b.disabled&&hitButton(mx,my,b))b.action()});return}
        if(gameState==='playing'&&isPaused){pauseButtons.forEach(b=>{if(hitButton(mx,my,b))b.action()});return}
        if(gameState==='dead'){deathButtons.forEach(b=>{if(hitButton(mx,my,b))b.action()});return}
        if(gameState==='floor_transition'){if(hitButton(mx,my,transitionBtn))applyNextFloor();return}
        if(gameState==='floor_clear')return;
        if(['present_heros','story','meeting','friends','tower','post10','post50','post60','post80','post93','post96','pre_rescue','rescue','tempestas_dialog','post_tempestas','ignis_dialog','post_ignis','victory'].includes(gameState)){onAdvance();return}
        if(gameState!=='playing'||isPaused)return;
        const joyR=joyZone.getBoundingClientRect(),fireR=document.getElementById('fireBtn').getBoundingClientRect(),pauseR=document.getElementById('pauseBtn').getBoundingClientRect();
        const onJoy=t.clientX>=joyR.left&&t.clientX<=joyR.right&&t.clientY>=joyR.top&&t.clientY<=joyR.bottom;
        const onFire=t.clientX>=fireR.left&&t.clientX<=fireR.right&&t.clientY>=fireR.top&&t.clientY<=fireR.bottom;
        const onPause=t.clientX>=pauseR.left&&t.clientX<=pauseR.right&&t.clientY>=pauseR.top&&t.clientY<=pauseR.bottom;
        if(!onJoy&&!onFire&&!onPause)swordAttack();
      },{passive:false});

      function spawnDisintegrate(x,y){
        for(let i=0;i<18;i++){
          const a=Math.random()*Math.PI*2,sp=0.4+Math.random()*2.2;
          particles.push({x:x+(Math.random()-0.5)*20,y:y+(Math.random()-0.5)*20,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.5,size:2+Math.random()*4,life:35+Math.random()*30,color:`hsl(${270+Math.random()*40},70%,${40+Math.random()*30}%)`});
        }
      }

      /* ===== IGNIS ===== */
      function updateIgnis(){
        if(!boss||boss.kind!=='ignis'||boss.hp<=0)return;
        boss.anim+=0.05;
        boss.phaseTimer++;

        if(ignisDown){
          if(lucianBalloon){lucianBalloon.timer--;if(lucianBalloon.timer<=0)lucianBalloon=null}
          if(lioraBalloon){lioraBalloon.timer--;if(lioraBalloon.timer<=0)lioraBalloon=null}
          if(valeriaBalloon){valeriaBalloon.timer--;if(valeriaBalloon.timer<=0)valeriaBalloon=null}
          return;
        }

        if(ignisOnFire){
          ignisFireTimer--;
          const dist=Math.hypot(player.x+player.size/2-(boss.x+boss.w/2),player.y+player.size/2-(boss.y+boss.h*0.5));
          if(dist<130&&player.invincible<=0){
            player.hp-=0.55;
            heat=Math.min(heatMax,heat+0.4);
            if(player.hp<=0){player.hp=0;gameState='dead';createDeathButtons()}
          }
          if(ignisFireTimer<=0)ignisOnFire=false;
        }

        const pct=boss.hp/boss.maxHp;
        if(pct>0.65)boss.phase=1;
        else if(pct>0.32)boss.phase=2;
        else boss.phase=3;

        boss.x+=boss.vx;
        if(boss.x<30||boss.x+boss.w>canvas.width-30)boss.vx*=-1;

        const dist=Math.hypot(player.x+player.size/2-(boss.x+boss.w/2),player.y+player.size/2-(boss.y+boss.h*0.5));
        if(dist<160)heat=Math.min(heatMax,heat+0.12);
        else heat=Math.max(0,heat-0.1);
        lavaZones.forEach(z=>{if(Math.hypot(player.x+player.size/2-z.x,player.y+player.size/2-z.y)<z.r)heat=Math.min(heatMax,heat+0.28)});
        if(heat>=heatMax&&player.invincible<=0){
          player.hp-=0.35;
          if(player.hp<=0){player.hp=0;gameState='dead';createDeathButtons()}
        }

        // CURA COMPLETA uma vez
        if(!lucianHealedOnce&&player.hp<30&&player.hp>0){
          lucianHealedOnce=true;
          player.hp=player.maxHp; // HP INTEIRO
          lucianBalloon={text:'Aguenta firme, irmão! Eu te curo!',timer:180};
          for(let i=0;i<45;i++)healParticles.push({
            x:player.x+24+(Math.random()-0.5)*50,y:player.y+20+(Math.random()-0.5)*40,
            vx:(Math.random()-0.5)*1.2,vy:-1-Math.random()*1.8,life:55,size:2+Math.random()*4,
            color:`hsla(${110+Math.random()*30},95%,65%,0.95)`
          });
        }

        if(!lioraBuffGiven&&pct<=0.55&&pct>0.45){
          lioraBuffGiven=true;
          damageBuff=1;damageBuffTimer=600;
          lioraBalloon={text:'Heros, recebe minha magia! Fica mais forte!',timer:180};
          for(let i=0;i<25;i++)particles.push({
            x:player.x+player.size/2,y:player.y+player.size/2,
            vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,size:3,life:30,color:'#88ddff'
          });
        }
        if(damageBuffTimer>0){damageBuffTimer--;if(damageBuffTimer<=0)damageBuff=0}

        boss.shootCd--;
        boss.dashCd=Math.max(0,boss.dashCd-1);
        boss.ringCd=Math.max(0,boss.ringCd-1);
        boss.reflectCd=Math.max(0,boss.reflectCd-1);
        if(reflectWindow>0)reflectWindow--;

        if(boss.reflectCd<=0&&Math.random()<0.012){
          boss.reflectCd=340;
          const ang=Math.atan2(player.y+player.size/2-(boss.y+boss.h*0.55),player.x+player.size/2-(boss.x+boss.w/2));
          bossProjectiles.push({
            type:'reflectable',
            x:boss.x+boss.w/2,y:boss.y+boss.h*0.55,
            vx:Math.cos(ang)*3.0,vy:Math.sin(ang)*3.0,
            size:18,life:170,dmg:18,reflected:false
          });
          reflectWindow=120;
          lioraBalloon={text:'Heros! Rebata com a espada!',timer:140};
          valeriaBalloon={text:'Corta o projétil!',timer:130};
        }

        if(boss.phase===1){
          if(boss.shootCd<=0){
            boss.shootCd=60+Math.random()*30;
            if(Math.random()<0.55){
              const ang=Math.atan2(player.y-boss.y,player.x+player.size/2-(boss.x+boss.w/2));
              bossProjectiles.push({type:'bounce',x:boss.x+boss.w/2,y:boss.y+boss.h*0.6,vx:Math.cos(ang)*3.8,vy:Math.sin(ang)*3.8,size:13,life:150,bounces:2,dmg:12});
            }else{
              for(let i=0;i<3;i++){
                const tx=player.x+player.size/2+(Math.random()-0.5)*150;
                bossProjectiles.push({type:'ember',x:tx,y:-20,vx:(Math.random()-0.5)*0.7,vy:2.8+Math.random(),size:8,life:110,dmg:8});
              }
            }
          }
          if(Math.random()<0.006){
            const ang=Math.atan2(player.y-boss.y,player.x-(boss.x+boss.w/2));
            fireTrails.push({x:boss.x+boss.w/2,y:boss.y+boss.h*0.5,angle:ang,len:0,maxLen:200,life:80,width:16});
          }
        }
        else if(boss.phase===2){
          if(boss.shootCd<=0){
            boss.shootCd=50+Math.random()*25;
            if(Math.random()<0.4){
              const ang=Math.atan2(player.y-boss.y,player.x-(boss.x+boss.w/2));
              bossProjectiles.push({type:'wave',x:boss.x+boss.w/2,y:boss.y+boss.h*0.7,vx:Math.cos(ang)*5,vy:Math.sin(ang)*5,size:18,life:85,dmg:15});
            }else{
              const ang=Math.atan2(player.y-boss.y,player.x-(boss.x+boss.w/2));
              bossProjectiles.push({type:'bounce',x:boss.x+boss.w/2,y:boss.y+boss.h*0.6,vx:Math.cos(ang)*4.2,vy:Math.sin(ang)*4.2,size:14,life:140,bounces:1,dmg:13});
            }
          }
          if(Math.random()<0.01&&fireClones.length<2){
            fireClones.push({x:boss.x+boss.w/2+(Math.random()-0.5)*80,y:boss.y+boss.h*0.5,vx:(Math.random()-0.5)*2,vy:1.3+Math.random(),life:140,size:26,real:false});
          }
          if(boss.ringCd<=0&&!ringFire){
            boss.ringCd=240;
            ringFire={x:boss.x+boss.w/2,y:boss.y+boss.h*0.6,r:30,maxR:200,expanding:true,life:150,dmg:13};
          }
          if(Math.random()<0.008&&lavaZones.length<3){
            lavaZones.push({x:60+Math.random()*(canvas.width-120),y:130+Math.random()*(canvas.height*0.45),r:36+Math.random()*22,life:180,pulse:0});
          }
        }
        else if(boss.phase===3){
          const tx=player.x+player.size/2,ty=player.y+player.size/2;
          const ang=Math.atan2(ty-(boss.y+boss.h*0.5),tx-(boss.x+boss.w/2));
          boss.x+=Math.cos(ang)*1.4;
          boss.y=Math.min(boss.y+0.25,canvas.height*0.22);

          if(boss.dashCd<=0&&Math.random()<0.015){
            boss.dashCd=110;
            const dang=Math.atan2(ty-(boss.y+boss.h*0.5),tx-(boss.x+boss.w/2));
            fireTrails.push({x:boss.x+boss.w/2,y:boss.y+boss.h*0.5,angle:dang,len:0,maxLen:260,life:90,width:20,dash:true});
            boss.x+=Math.cos(dang)*35;
          }
          if(boss.shootCd<=0){
            boss.shootCd=40;
            for(let i=0;i<2;i++){
              const a=ang+(i-0.5)*0.3;
              bossProjectiles.push({type:'bounce',x:boss.x+boss.w/2,y:boss.y+boss.h*0.55,vx:Math.cos(a)*4.6,vy:Math.sin(a)*4.6,size:12,life:95,bounces:0,dmg:14});
            }
          }
          if(Math.random()<0.012){
            for(let i=0;i<4;i++){
              const tx2=player.x+(Math.random()-0.5)*180;
              bossProjectiles.push({type:'meteor',x:tx2,y:-30-i*22,vx:0,vy:4.2,size:15,life:130,dmg:16,warn:true});
            }
          }
        }

        for(let i=fireTrails.length-1;i>=0;i--){
          const t=fireTrails[i];
          if(t.len<t.maxLen)t.len+=7;
          t.life--;
          const px=player.x+player.size/2,py=player.y+player.size/2;
          for(let s=0;s<t.len;s+=14){
            const fx=t.x+Math.cos(t.angle)*s,fy=t.y+Math.sin(t.angle)*s;
            if(Math.hypot(px-fx,py-fy)<t.width*0.55&&player.invincible<=0){
              player.hp-=9;player.invincible=28;heat=Math.min(heatMax,heat+10);
              if(player.hp<=0){player.hp=0;gameState='dead';createDeathButtons()}
              break;
            }
          }
          if(t.life<=0)fireTrails.splice(i,1);
        }
        for(let i=fireClones.length-1;i>=0;i--){
          const c=fireClones[i];
          const ang=Math.atan2(player.y-c.y,player.x-c.x);
          c.x+=Math.cos(ang)*2;c.y+=Math.sin(ang)*2;c.life--;
          if(Math.hypot(c.x-(player.x+player.size/2),c.y-(player.y+player.size/2))<c.size+player.size/2&&player.invincible<=0){
            player.hp-=10;player.invincible=32;heat+=7;
            fireClones.splice(i,1);
            if(player.hp<=0){player.hp=0;gameState='dead';createDeathButtons()}
            continue;
          }
          if(c.life<=0)fireClones.splice(i,1);
        }
        if(ringFire){
          if(ringFire.expanding){ringFire.r+=2;if(ringFire.r>=ringFire.maxR)ringFire.expanding=false}
          else ringFire.r-=1.6;
          ringFire.life--;
          const distR=Math.hypot(player.x+player.size/2-ringFire.x,player.y+player.size/2-ringFire.y);
          if(Math.abs(distR-ringFire.r)<15&&player.invincible<=0){
            player.hp-=ringFire.dmg;player.invincible=36;heat+=12;
            if(player.hp<=0){player.hp=0;gameState='dead';createDeathButtons()}
          }
          if(ringFire.life<=0||ringFire.r<18)ringFire=null;
        }
        for(let i=lavaZones.length-1;i>=0;i--){lavaZones[i].life--;lavaZones[i].pulse+=0.08;if(lavaZones[i].life<=0)lavaZones.splice(i,1)}

        // amigos atiram a cada 10s – projéteis que SEGUEM o Ignis
        allyShootTimer--;
        if(allyShootTimer<=0){
          allyShootTimer=600;
          partyAllies.forEach(a=>{
            bossProjectiles.push({
              type:'ally',
              x:a.x,y:a.y+10,
              vx:0,vy:0,
              size:9,life:160,dmg:4,
              home:true // segue o boss
            });
          });
        }

        if(lucianBalloon){lucianBalloon.timer--;if(lucianBalloon.timer<=0)lucianBalloon=null}
        if(lioraBalloon){lioraBalloon.timer--;if(lioraBalloon.timer<=0)lioraBalloon=null}
        if(valeriaBalloon){valeriaBalloon.timer--;if(valeriaBalloon.timer<=0)valeriaBalloon=null}
      }

      function updateBoss(){
        if(!boss||boss.hp<=0)return;
        if(boss.kind==='dragon'){updateDragon();return}
        if(boss.kind==='ignis'){updateIgnis();return}

        boss.anim+=0.04;boss.phaseTimer++;
        if(boss.phase===0){
          openingWait++;
          if(openingWait===300){
            const bx=boss.x+boss.w/2,by=boss.y+boss.h*0.65;
            bossProjectiles.push({type:'homing',x:bx,y:by,vx:0,vy:0,size:22,life:420,hit:false,trail:[]});
            for(let i=0;i<25;i++)particles.push({x:bx+(Math.random()-0.5)*30,y:by+(Math.random()-0.5)*30,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,size:3+Math.random()*3,life:30,color:'#c080ff'});
          }
        }else if(boss.phase===1){
          if(boss.phaseTimer===1)lucianBalloon={text:'Deixa comigo, Heros!',timer:220};
          if(boss.phaseTimer===40){
            for(let i=0;i<50;i++)healParticles.push({x:player.x+24+(Math.random()-0.5)*55,y:player.y+20+(Math.random()-0.5)*45,vx:(Math.random()-0.5)*1.2,vy:-0.9-Math.random()*1.8,life:60+Math.random()*40,size:2+Math.random()*4,color:`hsla(${110+Math.random()*30},95%,65%,0.95)`});
          }
          if(boss.phaseTimer===70)player.hp=player.maxHp;
          if(boss.phaseTimer>160){boss.phase=2;boss.phaseTimer=0;openingDone=true;lioraBalloon={text:'Não pise nas manchas no chão, Heros.',timer:240}}
        }else if(boss.phase===2){
          boss.shootCd--;
          if(boss.shootCd<=0){
            boss.shootCd=65+Math.random()*30;
            if(Math.random()<0.5){
              const tx=40+Math.random()*(canvas.width-80);
              bossProjectiles.push({type:'bolt',x:tx,y:boss.y+boss.h,vx:0,vy:4.4,size:10,life:160,dmg:11});
            }else{
              const bx=boss.x+boss.w/2,by=boss.y+boss.h*0.7;
              const ang=Math.atan2(player.y+player.size/2-by,player.x+player.size/2-bx);
              bossProjectiles.push({type:'orb',x:bx,y:by,vx:Math.cos(ang)*3.3,vy:Math.sin(ang)*3.3,size:12,life:150,dmg:9});
            }
          }
          if(Math.random()<0.004&&groundMarks.length<3){
            const nearX=player.x+player.size/2+(Math.random()-0.5)*140;
            const nearY=player.y+player.size/2+(Math.random()-0.5)*100;
            const mx=Math.max(50,Math.min(canvas.width-50,nearX));
            const my=Math.max(90,Math.min(barrierY-50,nearY));
            groundMarks.push({x:mx,y:my,r:32,life:480,dmg:16,flash:30,crack:Math.random()*Math.PI*2});
          }
        }
        if(openingDone){
          allyShootTimer--;
          if(allyShootTimer<=0){
            allyShootTimer=600;
            partyAllies.forEach(a=>{
              bossProjectiles.push({type:'ally',x:a.x,y:a.y+10,vx:0,vy:0,size:9,life:140,dmg:15,home:true});
            });
          }
        }
        if(lucianBalloon){lucianBalloon.timer--;if(lucianBalloon.timer<=0)lucianBalloon=null}
        if(lioraBalloon){lioraBalloon.timer--;if(lioraBalloon.timer<=0)lioraBalloon=null}
      }

      function updateBossProjectiles(){
        for(let i=bossProjectiles.length-1;i>=0;i--){
          const p=bossProjectiles[i];
          if(p.type==='homing'&&!p.hit){
            const tx=player.x+player.size/2,ty=player.y+player.size/2;
            const ang=Math.atan2(ty-p.y,tx-p.x);
            p.vx+=Math.cos(ang)*0.12;p.vy+=Math.sin(ang)*0.12;
            const sp=Math.sqrt(p.vx*p.vx+p.vy*p.vy);if(sp>2.4){p.vx=p.vx/sp*2.4;p.vy=p.vy/sp*2.4}
            p.x+=p.vx;p.y+=p.vy;p.life--;
            if(!p.trail)p.trail=[];p.trail.push({x:p.x,y:p.y,life:20});if(p.trail.length>18)p.trail.shift();p.trail.forEach(t=>t.life--);
            if(Math.hypot(p.x-tx,p.y-ty)<player.size/2+p.size){
              p.hit=true;p.life=0;player.hp=20;player.invincible=50;
              if(boss){boss.phase=1;boss.phaseTimer=0}
              for(let k=0;k<30;k++)particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,size:3+Math.random()*4,life:25,color:'#b060ff'});
            }
          }else if(p.type==='reflectable'){
            p.x+=p.vx;p.y+=p.vy;p.life--;

                  if(p.reflected&&boss&&boss.hp>0&&Math.hypot(p.x-(boss.x+boss.w/2),p.y-(boss.y+boss.h*0.5))<65){
                    if(boss.kind==='dragon'){boss.hp-=50;dragonStun=150;lioraBalloon={text:'Ele ficou desnorteado! Ataca!',timer:150}}
                    else if(boss.kind==='ignis'){boss.hp-=40;ignisDown=true;ignisDownDamage=0;lioraBalloon={text:'Agora, Heros! Ataca enquanto ele está caído!',timer:200}}
                    else{boss.hp-=30}
                    p.life=0;
                    for(let k=0;k<25;k++)particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,size:4,life:28,color:'#ffee88'});
                    if(boss.hp<=0){boss.hp=0;onBossDefeated()}
                    else if(boss.kind==='dragon'&&boss.hp<=dragonPhaseThreshold&&dragonPhase===1)onDragonPhaseEnd();
                  }

            if(!p.reflected&&player.invincible<=0&&Math.hypot(p.x-(player.x+player.size/2),p.y-(player.y+player.size/2))<player.size/2+p.size){
              player.hp-=(p.dmg||18);player.invincible=40;heat+=10;p.life=0;
              if(player.hp<=0){player.hp=0;gameState='dead';createDeathButtons()}
            }
          }else if(p.type==='bounce'||p.type==='wave'||p.type==='ember'||p.type==='meteor'||p.type==='orb'||p.type==='bolt'){
            p.x+=p.vx;p.y+=p.vy;p.life--;
            if(p.type==='bounce'&&p.bounces>0&&(p.y>canvas.height-80||p.y<20)){p.vy*=-0.85;p.bounces--}
            if(p.y>=barrierY&&(p.type==='bolt'||p.type==='orb'||p.type==='ember'||p.type==='meteor')){
              p.life=0;
              for(let k=0;k<8;k++)particles.push({x:p.x,y:barrierY,vx:(Math.random()-0.5)*4,vy:-1-Math.random()*2,size:2,life:14,color:p.type==='bolt'?'#90d0ff':'#ff6600'});
              continue;
            }
            if(player.invincible<=0&&Math.hypot(p.x-(player.x+player.size/2),p.y-(player.y+player.size/2))<player.size/2+p.size){
              player.hp-=(p.dmg||11);player.invincible=34;heat=Math.min(heatMax,heat+5);p.life=0;
              if(player.hp<=0){player.hp=0;gameState='dead';createDeathButtons()}
            }
          }else if(p.type==='ally'){
            // SEGUIR o boss (homing garantido)
            if(p.home&&boss&&boss.hp>0){
              const tx=boss.x+boss.w/2,ty=boss.y+boss.h*0.5;
              const ang=Math.atan2(ty-p.y,tx-p.x);
              const speed=6.2;
              p.vx=Math.cos(ang)*speed;
              p.vy=Math.sin(ang)*speed;
            }
            p.x+=p.vx;p.y+=p.vy;p.life--;
            if(boss&&boss.hp>0&&Math.hypot(p.x-(boss.x+boss.w/2),p.y-(boss.y+boss.h*0.5))<55){
              let dmg=p.dmg||4;
              if(ignisDown){ignisDownDamage+=dmg;if(ignisDownDamage>=100){ignisDown=false;ignisOnFire=true;ignisFireTimer=360;valeriaBalloon={text:'Sai de perto! Ele pegou fogo!',timer:180}}}
              boss.hp-=dmg;p.life=0;
              for(let k=0;k<8;k++)particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,size:3,life:16,color:'#60e0ff'});
              if(boss.hp<=0){boss.hp=0;onBossDefeated()}
              else if(boss.kind==='dragon'&&boss.hp<=dragonPhaseThreshold&&dragonPhase===1)onDragonPhaseEnd();
            }
          }
          if(p.life<=0)bossProjectiles.splice(i,1);
        }
        for(let i=groundMarks.length-1;i>=0;i--){
          const m=groundMarks[i];m.life--;if(m.flash>0)m.flash--;
          if(player.invincible<=0&&Math.hypot(player.x+player.size/2-m.x,player.y+player.size/2-m.y)<m.r+player.size/2){
            player.hp-=m.dmg;player.invincible=40;
            if(player.hp<=0){player.hp=0;gameState='dead';createDeathButtons()}
          }
          if(m.life<=0)groundMarks.splice(i,1);
        }
      }

      function updateRescue(){
        rescueTimer++;
        if(rescueStep===0){
          let anyTouch=false;
          rescueMonsters.forEach(m=>{if(!m.alive||m.dying)return;m.anim+=0.035;if(!hitboxTouch(m))m.y+=m.speed;else anyTouch=true});
          if(anyTouch||rescueMonsters[0].y+rescueMonsters[0].size>=player.y){showFriends=true;rescueStep=1;rescueTimer=0}
        }else if(rescueStep===1){
          let allArrived=true;
          friendActors.forEach(f=>{if(f.y>f.ty){f.y-=1.8;allArrived=false}else f.y=f.ty});
          if(allArrived&&rescueTimer>25){
            friendActors.forEach((f,i)=>{
              const target=rescueMonsters[i]||rescueMonsters[0];
              const dx=(target.x+target.size/2)-f.x,dy=(target.y+target.size/2)-(f.y+10),dist=Math.sqrt(dx*dx+dy*dy)||1;
              friendShots.push({x:f.x,y:f.y+10,vx:dx/dist*3.8,vy:dy/dist*3.8,life:100,size:11,hue:i===1?120:280});
            });
            rescueStep=2;rescueTimer=0;
          }
        }else if(rescueStep===2){
          friendShots.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.life--});
          if(rescueTimer===35){rescueMonsters.forEach(m=>{m.dying=true;spawnDisintegrate(m.x+m.size/2,m.y+m.size/2)});friendShots=[]}
          if(rescueTimer>35)rescueMonsters.forEach(m=>{if(m.dying){m.alpha-=0.012;if(rescueTimer%8===0)spawnDisintegrate(m.x+m.size/2,m.y+m.size/2);if(m.alpha<=0){m.alive=false;m.alpha=0}}});
          if(rescueTimer>120){rescueStep=3;rescueTimer=0;dialogFade=0}
        }else if(rescueStep===3){dialogFade=Math.min(1,dialogFade+0.025);if(dialogFade>=1&&rescueTimer>20)rescueStep=4}
        else if(rescueStep===5){for(let i=healParticles.length-1;i>=0;i--){const p=healParticles[i];p.x+=p.vx;p.y+=p.vy;p.life--;p.size*=0.985;if(p.life<=0)healParticles.splice(i,1)}}
        for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.97;p.vy*=0.97;p.life--;p.size*=0.98;if(p.life<=0||p.size<0.4)particles.splice(i,1)}
      }

      function drawFriendSprite(actor){
        const img=friendSprites[actor.key];
        if(img){const scale=actor.size/img.height;const dw=img.width*scale;ctx.drawImage(img,actor.x-dw/2,actor.y,dw,actor.size)}
        else{ctx.fillStyle='#888';ctx.fillRect(actor.x-20,actor.y,40,actor.size)}
        const nome=actor.key.charAt(0).toUpperCase()+actor.key.slice(1);
        ctx.font='bold 11px Georgia,serif';ctx.textAlign='center';
        ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillText(nome,actor.x+1,actor.y-4);
        ctx.fillStyle='#e8d5a3';ctx.fillText(nome,actor.x,actor.y-5);
      }

      function drawRescueScene(){
        const w=canvas.width,h=canvas.height,theme=getTheme();

          drawEchoDialogBg();

          else if(rescueStep===5){
            drawDialogBox('Lucian','Aguente, Heros... você vai ficar bem.','lucian');
            const g=ctx.createRadialGradient(w/2,h*0.4,5,w/2,h*0.4,100);

        }

        rescueMonsters.forEach(m=>{if(!m.alive&&m.alpha<=0)return;ctx.globalAlpha=Math.max(0,m.alpha);drawBigMonster({x:m.x,y:m.y,size:m.size,anim:m.anim});ctx.globalAlpha=1});
        friendShots.forEach(s=>{const g=ctx.createRadialGradient(s.x,s.y,1,s.x,s.y,s.size);g.addColorStop(0,'#fff');g.addColorStop(0.4,`hsl(${s.hue},90%,70%)`);g.addColorStop(1,`hsla(${s.hue},90%,50%,0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill()});
        particles.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life/30);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});
        drawHerosLying();
        if(showFriends)friendActors.forEach(drawFriendSprite);
        // HP bar maior + texto centralizado
        ctx.fillStyle='#222';ctx.fillRect(20,18,190,22);
        ctx.fillStyle='#ff3333';ctx.fillRect(20,18,(2/Math.max(player.maxHp,2))*190,22);
        ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(20,18,190,22);
        ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(`HP: 2/${player.maxHp}`,20+95,18+11);
        ctx.textAlign='left';ctx.textBaseline='alphabetic';
        ctx.fillStyle='#ffcc00';ctx.font='16px Arial';ctx.fillText(getTheme().name,20,56);
        if(rescueStep===3){ctx.fillStyle=`rgba(0,0,0,${dialogFade*0.85})`;ctx.fillRect(0,0,w,h)}

     function update(){
        if(gameState==='title'){titleTimer++;if(titleTimer>90){titleAlpha-=0.012;if(titleAlpha<=0){titleAlpha=0;hasSave=checkSaveExists();gameState='menu';setupMenuButtons()}}return}
        if(gameState==='floor_clear'){clearTimer--;if(clearTimer<=0)afterClearSequence();return}
        if(gameState==='rescue'){updateRescue();return}
        if(['post10','post50','post60','post80','post93','post96','pre_rescue','tempestas_dialog','post_tempestas','ignis_dialog','post_ignis','menu'].includes(gameState))return;
        if(gameState!=='playing'||isPaused)return;

        updateFlameParticles();
        if(boss){updateBoss();updateBossProjectiles()}

        for(let i=healParticles.length-1;i>=0;i--){const p=healParticles[i];p.x+=p.vx;p.y+=p.vy;p.life--;p.size*=0.985;if(p.life<=0)healParticles.splice(i,1)}

        if(spawnQueue>0){const alive=enemies.filter(e=>e.alive).length;if(alive<maxConcurrent){spawnTimer++;if(spawnTimer>40){spawnTimer=0;spawnOneEnemy();spawnQueue--}}}
        let dx=0,dy=0;
        if(keys['KeyW']||keys['ArrowUp'])dy-=1;if(keys['KeyS']||keys['ArrowDown'])dy+=1;
        if(keys['KeyA']||keys['ArrowLeft'])dx-=1;if(keys['KeyD']||keys['ArrowRight'])dx+=1;
        if(joyActive){dx=joyDX;dy=joyDY}
        const moving=dx!==0||dy!==0;
        if(moving&&player.state!=='ataque'){
          const len=Math.sqrt(dx*dx+dy*dy);if(len>0){dx/=len;dy/=len}
          player.x+=dx*player.speed;player.y+=dy*player.speed;player.angle=Math.atan2(dy,dx);
          if(Math.abs(dx)>Math.abs(dy))player.dir=dx>0?'direita':'esquerda';else player.dir=dy>0?'baixo':'cima';
          player.state='andar';
        }else if(player.state!=='ataque'){player.state='parado';player.frame=0}
        const key=getAnimKey(),conf=animConfig[key];
        if(conf&&player.state!=='parado'){player.frameTimer++;if(player.frameTimer>=conf.speed){player.frameTimer=0;player.frame++;if(player.frame>=conf.frames){player.frame=0;if(player.state==='ataque')player.state=moving?'andar':'parado'}}}
        else if(player.state==='parado')player.frame=0;
        player.x=Math.max(0,Math.min(canvas.width-player.size,player.x));
        const maxY=getTheme().allies?Math.min(barrierY-player.size-4,canvas.height-player.size-100):canvas.height-player.size;
        player.y=Math.max(0,Math.min(maxY,player.y));
        if(mouse.left)swordAttack();else if(mouse.right)createFireball();
        if(player.attackCooldown>0)player.attackCooldown--;if(player.fireCooldown>0)player.fireCooldown--;
        if(player.slashTimer>0)player.slashTimer--;if(player.invincible>0)player.invincible--;

        enemies.forEach(enemy=>{
          if(!enemy.alive)return;
          enemy.anim+=0.1;
          const ang=Math.atan2(player.y+player.size/2-(enemy.y+enemy.size/2),player.x+player.size/2-(enemy.x+enemy.size/2));
          enemy.x+=Math.cos(ang)*enemy.speed;enemy.y+=Math.sin(ang)*enemy.speed;
          if(enemy.canShoot){enemy.shootCd--;if(enemy.shootCd<=0){enemy.shootCd=120;const a=Math.atan2(player.y+player.size/2-(enemy.y+enemy.size/2),player.x+player.size/2-(enemy.x+enemy.size/2));enemyShots.push({x:enemy.x+enemy.size/2,y:enemy.y+enemy.size/2,vx:Math.cos(a)*2.0,vy:Math.sin(a)*2.0,life:220,size:10})}}
          if(player.invincible<=0&&player.x<enemy.x+enemy.size&&player.x+player.size>enemy.x&&player.y<enemy.y+enemy.size&&player.y+player.size>enemy.y){
            player.hp-=enemy.damage;player.invincible=50;
            if(player.hp<=0){player.hp=0;gameState='dead';createDeathButtons()}
          }
        });
        for(let i=enemyShots.length-1;i>=0;i--){
          const s=enemyShots[i];s.x+=s.vx;s.y+=s.vy;s.life--;
          if(player.invincible<=0&&Math.hypot(s.x-(player.x+player.size/2),s.y-(player.y+player.size/2))<player.size/2+s.size){player.hp-=15;player.invincible=40;s.life=0;if(player.hp<=0){player.hp=0;gameState='dead';createDeathButtons()}}
          if(s.life<=0||s.x<-50||s.x>canvas.width+50||s.y<-50||s.y>canvas.height+50)enemyShots.splice(i,1);
        }
        for(let i=fireballs.length-1;i>=0;i--){
          const f=fireballs[i];f.x+=f.vx;f.y+=f.vy;f.life--;
          enemies.forEach(e=>{if(!e.alive)return;if(Math.hypot(e.x+e.size/2-f.x,e.y+e.size/2-f.y)<e.size/2+f.size/2){damageEnemy(e,f.dmg);f.life=0}});
          if(boss&&boss.hp>0&&Math.hypot(f.x-(boss.x+boss.w/2),f.y-(boss.y+boss.h*0.5))<boss.w*0.4){
            if(boss.kind==='ignis'&&boss.phase<3&&!ignisDown){
              boss.hp=Math.min(boss.maxHp,boss.hp+2);
              for(let k=0;k<5;k++)particles.push({x:f.x,y:f.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,size:3,life:14,color:'#ffaa00'});
            }else if(!(boss.kind==='dragon'&&dragonMode==='sword')){
              let dmg=f.dmg;
              if(ignisDown){ignisDownDamage+=dmg;if(ignisDownDamage>=100){ignisDown=false;ignisOnFire=true;ignisFireTimer=360;valeriaBalloon={text:'Sai de perto! Ele pegou fogo!',timer:180}}}
              boss.hp-=dmg;
              for(let k=0;k<5;k++)particles.push({x:f.x,y:f.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,size:3,life:15,color:boss.kind==='dragon'?'#ff4060':boss.kind==='ignis'?'#ff4400':'#c080ff'});
              if(boss.hp<=0){boss.hp=0;onBossDefeated()}
              else if(boss.kind==='dragon'&&boss.hp<=dragonPhaseThreshold&&dragonPhase===1)onDragonPhaseEnd();
            }
            f.life=0;
          }
          if(f.life<=0||f.x<-80||f.x>canvas.width+80||f.y<-80||f.y>canvas.height+80)fireballs.splice(i,1);
        }
        for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;p.life--;p.size*=0.96;if(p.life<=0||p.size<0.5)particles.splice(i,1)}
        if(saveMsgTimer>0)saveMsgTimer--;
      }

      function drawBossProjectiles(){
        floorCracks.forEach(c=>{
          ctx.fillStyle=`rgba(40,10,15,${0.5+c.life/480})`;
          ctx.fillRect(c.x,c.y,c.w,c.h);

          for(let s=0;s<t.len;s+=6){
            const fx=t.x+Math.cos(t.angle)*s,fy=t.y+Math.sin(t.angle)*s;

            ctx.fillStyle=g;ctx.beginPath();ctx.arc(fx,fy,t.width*0.55,0,Math.PI*2);ctx.fill();
          }
          ctx.globalAlpha=1;
        });
        fireClones.forEach(c=>{
          const g=ctx.createRadialGradient(c.x,c.y,2,c.x,c.y,c.size);
          g.addColorStop(0,'rgba(255,180,50,0.85)');g.addColorStop(0.5,'rgba(255,60,0,0.4)');g.addColorStop(1,'rgba(0,0,0,0)');
          ctx.fillStyle=g;ctx.beginPath();ctx.arc(c.x,c.y,c.size,0,Math.PI*2);ctx.fill();
